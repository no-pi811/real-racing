    // ---------- レース生成 ----------
    newRace(venueId, opt) {
      const g = RRG.game;
      const cur = g.current();
      if (cur && !cur.settled) {
        if (cur.status === 'open') {
          this.confirm('進行中のレースがあります', '発売中のレースを取りやめて新しいレースを作りますか？<br>購入済みの馬券（' + U.fmtCoin(g.ticketTotal()) + 'コイン）は全額返金されます。', '新しいレースへ', () => {
            g.abandonOpenRace(); this.newRace(venueId, opt);
          });
        } else this.toast('締切済みのレースがあります。先に観戦・精算してください', 'err');
        return;
      }
      if (cur && cur.settled) g.finishRace();
      const race = g.createRace(venueId, opt);
      const m = this.modal({ title: 'オッズ集計中…', body: '<div class="loading"><div class="spinner"></div><div class="muted small">出走馬の能力から想定オッズを算出しています</div><div class="pbar"><i></i></div></div>', dismiss: false });
      const bar = m.querySelector('.pbar i');
      g.prepareOdds(race, (p) => { bar.style.width = Math.round(p * 100) + '%'; }).then(() => {
        this.closeModal();
        g.setCurrent(race);
        this.bet = { type: 'tansho', mode: 'normal', sel: [], form: [[], [], []], stake: this.bet.stake || 100, sort: this.bet.sort || 'num' };
        this.cardTab = 'card';
        this.openDetail = null;
        this.renderCard();
        this.show('card');
      }).catch((e) => { this.closeModal(); console.error(e); this.toast('レースの準備に失敗しました: ' + e.message, 'err', 4000); });
    },

    // ---------- デイリーミッション ----------
    missionsHtml() {
      const g = RRG.game, d = g.daily();
      const rows = d.ids.map((id) => {
        const m = g.missionDef(id), p = d.prog[id] || 0, done = p >= m.goal, cl = d.claimed[id];
        return '<div class="ms-row' + (cl ? ' claimed' : done ? ' done' : '') + '"><div class="grow"><div class="ms-t">' + (cl ? '✅ ' : done ? '🎯 ' : '') + esc(m.text) + '</div>' +
          '<div class="ms-bar"><i style="width:' + Math.round(p / m.goal * 100) + '%"></i></div><div class="small muted">' + p + ' / ' + m.goal + '　報酬 ' + U.fmtCoin(m.reward) + 'コイン</div></div>' +
          (cl ? '<span class="small muted">受取済</span>' : '<button class="btn btn-sm ' + (done ? 'btn-gold' : '') + '" data-claim="' + id + '"' + (done ? '' : ' disabled') + '>受け取る</button>') + '</div>';
      }).join('');
      return '<div class="panel missions"><div class="ms-head"><b>🎯 今日のミッション</b><span class="small muted">3つすべて受け取ると +' + U.fmtCoin(D.MISSION_BONUS) + 'コイン' + (d.bonus ? '（獲得済み）' : '') + '・毎日0時に更新</span></div>' + rows + '</div>';
    },

    // ---------- 新聞の予想欄 ----------
    renderPress(box) {
      const g = RRG.game, r = g.current(), v = g.venue(r.venueId);
      if (!r.press && r.odds) r.press = g.makePress(r);
      const P = r.press || {};
      const reps = D.REPORTERS;
      const pts = { '◎': 4, '○': 3, '▲': 2, '△': 1 };
      const PS = g.save.pressStats || {};
      const dt = new Date();
      let h = '<div class="paper"><div class="paper-head"><div class="paper-title">競馬リアル新聞</div><div class="paper-date">' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + esc(v.name) + ' 第' + r.no + 'レース</div></div>' +
        '<div class="paper-race"><b>' + esc(r.name) + '</b>（' + esc(r.grade) + '）' + v.surface + v.lap + 'm ・ 天候' + esc((D.WEATHERS.find((w) => w.id === r.weather) || D.WEATHERS[0]).name) + ' ・ 馬場' + D.GOINGS[r.going || 0].name + '</div>' +
        '<table class="paper-table"><thead><tr><th>馬番</th><th class="pt-name">馬名</th>' + reps.map((rp) => '<th>' + esc(rp.name.split('・')[1] || rp.name) + '</th>').join('') + '<th>総合</th><th>単勝</th></tr></thead><tbody>';
      const total = (num) => reps.reduce((a, rp) => a + (pts[(P[rp.id] || { marks: {} }).marks[num]] || 0), 0);
      r.runners.forEach((ru) => {
        const hs = g.horse(ru.horseId), tt = total(ru.num);
        h += '<tr><td>' + chip(ru.num, ru.waku) + '</td><td class="pt-name">' + esc(hs.name) + '</td>' +
          reps.map((rp) => '<td class="pm">' + ((P[rp.id] && P[rp.id].marks[ru.num]) || '') + '</td>').join('') +
          '<td class="pt-total">' + (tt ? '<i style="width:' + Math.round(tt / 12 * 100) + '%"></i><span>' + tt + '</span>' : '') + '</td><td class="pt-odds">' + U.fmtOdds(r.odds.tansho[ru.num]) + '</td></tr>';
      });
      h += '</tbody></table><div class="paper-cols">';
      reps.forEach((rp) => {
        const pr = P[rp.id];
        if (!pr) return;
        const st = PS[rp.id];
        const hon = r.runners.find((x) => x.num === pr.honmei), hh = g.horse(hon.horseId);
        h += '<div class="paper-col" style="--rc:' + rp.color + '"><div class="pc-head"><b>' + esc(rp.name) + '</b><span>' + esc(rp.role) + '</span></div>' +
          '<div class="pc-style">' + esc(rp.style) + '</div>' +
          '<div class="pc-pick">◎ ' + hon.num + ' ' + esc(hh.name) + '</div><div class="pc-cmt">「' + esc(pr.comment) + '」</div>' +
          '<div class="pc-rec">' + (st && st.races ? '◎の成績 ' + st.races + '戦：勝率' + Math.round(st.win / st.races * 100) + '%・複勝率' + Math.round(st.top3 / st.races * 100) + '%' : '◎の成績：まだ記録がありません') + '</div>' +
          '<button class="btn btn-sm" data-copy="' + rp.id + '">この印を自分の印にする</button></div>';
      });
      h += '</div><p class="paper-note">※記者の予想はゲーム内の架空のものです。当たるとは限りません。</p></div>';
      box.innerHTML = h;
      box.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
        const pr = P[b.dataset.copy];
        if (!pr || r.status !== 'open') return;
        r.marks = {};
        Object.keys(pr.marks).forEach((k) => { r.marks[k] = pr.marks[k]; });
        g.persist();
        RRG.audio.click();
        this.toast('記者の印をコピーしました。馬券購入の「印から選ぶ」で使えます', 'good', 3000);
      }));
    },

    // ---------- グランプリシーズン ----------
    startSeasonRace() {
      const g = RRG.game, se = g.season(), nx = g.seasonNext();
      if (!nx) return;
      this.newRace(nx.venue, { name: nx.name, grade: nx.grade, season: { no: se.no, idx: se.idx }, fieldSize: nx.grade === 'G1' ? 12 : undefined });
    },
    renderSeason() {
      const g = RRG.game, se = g.season();
      const profit = se.payout - se.bet;
      const cur = g.current();
      let h = '<div class="wrap"><h2 class="sec">グランプリシーズン 第' + se.no + '期</h2>' +
        '<p class="small muted">全' + D.SEASON.length + '戦の収支で称号が決まります。最終戦はG1「グランプリ・ファイナル」。シーズン戦はどの競馬場も開放済みとして出走できます。</p>' +
        '<div class="panel"><div class="sumgrid">' +
        '<div class="cell"><div class="k">進行</div><div class="v">' + se.idx + ' / ' + D.SEASON.length + '戦</div></div>' +
        '<div class="cell"><div class="k">シーズン収支</div><div class="v ' + (profit > 0 ? 'plus' : profit < 0 ? 'minus' : '') + '">' + signed(profit) + '</div></div>' +
        '<div class="cell"><div class="k">的中レース</div><div class="v">' + se.hits + '</div></div>' +
        '<div class="cell"><div class="k">現在の見込み称号</div><div class="v" style="font-size:16px;color:' + g.titleFor(profit).color + '">' + esc(g.titleFor(profit).name) + '</div></div></div></div>';
      h += '<div class="panel" style="margin-top:14px"><h2 class="sec">スケジュール</h2><div class="sched">';
      D.SEASON.forEach((x, i) => {
        const v = g.venue(x.venue);
        const done = se.races[i];
        const st = i < se.idx ? 'done' : i === se.idx ? 'next' : '';
        h += '<div class="sched-row ' + st + '"><span class="sch-no">' + (i + 1) + '</span><div class="grow"><b>' + esc(x.name) + '</b> <span class="grade ' + x.grade + '">' + esc(x.grade) + '</span><div class="small muted">' + esc(v.name) + '・' + v.surface + v.lap + 'm</div></div>' +
          (done ? '<span class="small ' + (done.payout - done.bet >= 0 ? 'plus' : 'minus') + '">' + (done.bet ? signed(done.payout - done.bet) : '見送り') + '</span>' : i === se.idx ? '<b class="small" style="color:var(--gold2)">次戦</b>' : '') + '</div>';
      });
      h += '</div><div class="btn-row">' + (g.seasonNext() ? '<button class="btn btn-gold btn-lg" id="ss-next">第' + (se.idx + 1) + '戦 ' + esc(g.seasonNext().name) + 'へ ▶</button>' : '') +
        (se.idx > 0 ? '<button class="btn" id="ss-reset">シーズンをやり直す</button>' : '') + '</div></div>';
      // 称号とランキング
      const ranking = g.seasonRanking();
      h += '<div class="grid2" style="margin-top:14px"><div class="panel"><h2 class="sec">称号</h2>' +
        D.TITLES.map((t) => '<div class="title-row"><span class="title-badge" style="--tc:' + t.color + '">' + esc(t.name) + '</span><span class="small muted">' + (t.min === -Infinity ? '収支マイナス' : '収支 ' + signed(t.min) + ' 以上') + '</span></div>').join('') + '</div>' +
        '<div class="panel"><h2 class="sec">ランキング（この端末）</h2>' +
        (ranking.length ? '<table class="res-table"><thead><tr><th>順位</th><th>期</th><th>称号</th><th class="num">収支</th></tr></thead><tbody>' +
          ranking.map((x, i) => { const t = D.TITLES.find((tt) => tt.id === x.title); return '<tr><td class="pos">' + (i + 1) + '</td><td>第' + x.no + '期</td><td><span class="title-badge sm" style="--tc:' + t.color + '">' + esc(t.name) + '</span></td><td class="num ' + (x.profit >= 0 ? 'plus' : 'minus') + '">' + signed(x.profit) + '</td></tr>'; }).join('') + '</tbody></table>'
          : '<p class="muted small">シーズンを完走すると記録されます。</p>') + '</div></div></div>';
      $('#scr-season').innerHTML = h;
      const nb = $('#ss-next');
      if (nb) nb.addEventListener('click', () => {
        RRG.audio.unlock(); RRG.audio.click();
        if (cur && !cur.settled && cur.season && cur.season.no === se.no && cur.season.idx === se.idx) { this.resumeRace(); return; }
        this.startSeasonRace();
      });
      const rb = $('#ss-reset');
      if (rb) rb.addEventListener('click', () => this.confirm('シーズンをやり直しますか？', '現在のシーズンの成績は破棄され、新しいシーズン（第' + (se.no + 1) + '期）を第1戦から始めます。コインは戻りません。', 'やり直す', () => { g.resetSeason(); this.renderSeason(); }, 'btn-red'));
    },

    // ---------- パドック ----------
    renderPaddock(box) {
      const g = RRG.game, r = g.current();
      if (!this.paddockBox) {
        this.paddockBox = document.createElement('div');
        this.paddockBox.className = 'pd-stage';
        this.paddockBox.innerHTML = '<canvas class="pd-canvas"></canvas><div class="rv-labels pd-labels"></div><div class="pd-hint">🐎 一覧の馬をタップするとカメラが追いかけます</div>';
      }
      let h = '<div class="pd-wrap"></div><div class="pd-list">';
      r.runners.slice().forEach((ru) => {
        const hs = g.horse(ru.horseId), cv = D.COND[String(ru.condView || 0)];
        h += '<button class="pd-item" data-num="' + ru.num + '">' + chip(ru.num, ru.waku) + '<div class="grow" style="min-width:0"><div class="pn"><b>' + esc(hs.name) + '</b> <span class="small muted">' + hs.sex + hs.age + '・' + hs.coat + '</span></div><div class="small">「' + esc(ru.condComment || '') + '」</div></div>' +
          '<span class="cond-mark c' + (ru.condView || 0) + '">' + cv.mark + '</span><span class="small muted" style="width:52px;text-align:right">' + esc(cv.label) + '</span></button>';
      });
      h += '</div><p class="small muted">パドックでは各馬の当日の状態（気配）が分かります。気配の良い馬は能力以上に走ることも。ただし解説の見立てが外れることもあります。イレ込んでいる馬は首を上げ下げして落ち着きません。</p>';
      box.innerHTML = h;
      box.querySelector('.pd-wrap').appendChild(this.paddockBox);
      try {
        if (!this.paddock) this.paddock = new RRG.Paddock(this.paddockBox.querySelector('canvas'), this.paddockBox.querySelector('.pd-labels'));
        if (this.paddock.race !== r) { this.paddock.setRace(r); this.paddock.focus = null; }
        this.paddock.start();
      } catch (e) {
        console.warn(e);
        this.paddockBox.innerHTML = '<div class="notice info">この環境では3Dパドックを表示できません。下の一覧で各馬の気配を確認できます。</div>';
      }
      const sync = () => box.querySelectorAll('.pd-item').forEach((it) => it.classList.toggle('on', this.paddock && Number(it.dataset.num) === this.paddock.focus));
      box.querySelectorAll('.pd-item').forEach((it) => it.addEventListener('click', () => {
        if (!this.paddock) return;
        const n = Number(it.dataset.num);
        this.paddock.focus = this.paddock.focus === n ? null : n;
        RRG.audio.click(); sync();
        this.paddockBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }));
      sync();
    },

    resumeRace() {
      const r = RRG.game.current();
      if (!r) return;
      if (r.status === 'open') { this.renderCard(); this.show('card'); }
      else if (!r.settled) this.runRace();
      else { this.renderResult(r.settlement); this.show('result'); }
    },

    // ---------- 出走表 + 馬券購入 ----------
    renderCard() {
      const g = RRG.game, r = g.current();
      if (!r) { this.goMenu(); return; }
      const v = g.venue(r.venueId);
      const el = $('#scr-card');
      const nT = r.tickets.length;
      el.innerHTML = '<div class="wrap">' +
        '<div class="race-head"><div class="rh-main"><b>' + esc(v.short) + ' ' + r.no + 'R ' + esc(r.name) + '</b><span class="grade ' + r.grade + '">' + esc(r.grade) + '</span>' +
        '<div class="rh-sub">' + esc(v.name) + '・' + v.surface + v.lap + 'm（1周）・' + r.runners.length + '頭立て' + (r.fixedTest ? '・<b style="color:#ffd36a">テスト用固定レース</b>' : '') +
        (r.season ? '・<b style="color:#ffd36a">シーズン第' + (r.season.idx + 1) + '戦</b>' : '') + '</div>' +
        '<div class="cond-line">' + weatherBadge(r) + '</div></div>' +
        '<div class="small muted">※オッズはゲーム内の仮想オッズ（購入時に確定する固定オッズ方式）</div></div>' +
        (g.isLow() && g.bonusState().available ? '<div class="notice warn">⚠️ <span class="grow">コインが少なくなっています</span><button class="btn btn-sm btn-gold" id="cd-bonus">救済ボーナスを受け取る</button></div>' : '') +
        '<div class="tabs"><button data-tab="card" class="' + (this.cardTab === 'card' ? 'on' : '') + '">出走表</button><button data-tab="paddock" class="' + (this.cardTab === 'paddock' ? 'on' : '') + '">パドック</button><button data-tab="press" class="' + (this.cardTab === 'press' ? 'on' : '') + '">予想</button><button data-tab="bet" class="' + (this.cardTab === 'bet' ? 'on' : '') + '">馬券購入' + (nT ? '<span class="badge">' + nT + '</span>' : '') + '</button></div>' +
        '<div id="cd-body"></div></div>';
      el.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { RRG.audio.click(); this.cardTab = b.dataset.tab; this.renderCard(); }));
      const bb = $('#cd-bonus');
      if (bb) bb.addEventListener('click', () => { const a = g.claimBonus(); if (a) { RRG.audio.coin(); this.toast('+' + U.fmtCoin(a) + ' コイン', 'good'); } this.renderCard(); });
      if (this.cardTab !== 'paddock' && this.paddock) this.paddock.stop();
      if (this.cardTab === 'card') this.renderRunners($('#cd-body'));
      else if (this.cardTab === 'paddock') this.renderPaddock($('#cd-body'));
      else if (this.cardTab === 'press') this.renderPress($('#cd-body'));
      else this.renderBetting($('#cd-body'));
      this.renderSticky();
    },

    renderSticky() {
      const g = RRG.game, r = g.current();
      if (!r) return;
      const total = g.ticketTotal();
      this.sticky.innerHTML = '<div class="inner"><div class="sum">所持 <b>' + U.fmtCoin(g.save.coins) + '</b><br>購入 <b>' + r.tickets.length + '</b>件・<b>' + U.fmtCoin(total) + '</b></div>' +
        (this.cardTab !== 'bet' ? '<button class="btn btn-green" id="sb-bet">馬券を買う</button>' : '<button class="btn" id="sb-card">出走表</button>') +
        '<button class="btn btn-gold" id="sb-start">締切・発走 ▶</button></div>';
      const a = $('#sb-bet'), c = $('#sb-card');
      if (a) a.addEventListener('click', () => { RRG.audio.click(); this.cardTab = 'bet'; this.renderCard(); $('#scr-card').scrollTop = 0; });
      if (c) c.addEventListener('click', () => { RRG.audio.click(); this.cardTab = 'card'; this.renderCard(); });
      $('#sb-start').addEventListener('click', () => { RRG.audio.unlock(); RRG.audio.click(); this.confirmClose(); });
    },

    renderRunners(box) {
      const g = RRG.game, r = g.current(), od = r.odds;
      const marks = r.marks || {};
      let h = '<table class="card-table"><thead><tr><th>印</th><th class="hide-sm">枠</th><th>馬番</th><th>馬名・騎手</th><th class="hide-sm">脚質</th><th class="hide-sm">能力</th><th class="hide-sm">道悪</th><th>気配</th><th>人気</th><th style="text-align:right">単勝</th></tr></thead><tbody>';
      r.runners.forEach((ru) => {
        const hs = g.horse(ru.horseId), w = D.WAKU[ru.waku];
        const rec = g.save.horseRecords[hs.id];
        const rank = abilityRank(hs);
        const pop = od.popularity[ru.num];
        const cv = D.COND[String(ru.condView || 0)];
        h += '<tr class="runner" data-num="' + ru.num + '"><td class="mark-cell"><button class="mark-btn' + (marks[ru.num] ? ' on' : '') + '" data-mark="' + ru.num + '" aria-label="予想印">' + (marks[ru.num] || '') + '</button></td>' +
          '<td class="waku-cell hide-sm" style="background:' + w.color + ';color:' + w.text + '">' + ru.waku + '</td>' +
          '<td style="text-align:center">' + chip(ru.num, ru.waku) + '</td>' +
          '<td>' + silkSwatch(hs.silk) + '<span class="hname">' + esc(hs.name) + '</span><div class="hsub">' + hs.sex + hs.age + '・' + hs.coat + '・' + esc(hs.jockey) + (rec ? '・' + rec.starts + '戦' + rec.wins + '勝' : '') + '</div><div class="show-sm hsub"><span class="style-tag ' + hs.style + '">' + hs.style + '</span> 能力' + rank + '・道悪' + hs.mud + '</div></td>' +
          '<td class="hide-sm"><span class="style-tag ' + hs.style + '">' + hs.style + '</span></td>' +
          '<td class="hide-sm"><span class="rank-letter ' + rank + '">' + rank + '</span></td>' +
          '<td class="hide-sm"><span class="mud-tag mud-' + hs.mud + '">' + hs.mud + '</span></td>' +
          '<td><span class="cond-mark c' + (ru.condView || 0) + '" title="' + esc(cv.label) + '">' + cv.mark + '</span></td>' +
          '<td class="pop">' + pop + '<span class="hide-sm">番</span>人気</td>' +
          '<td style="text-align:right"><span class="odds' + (pop <= 1 ? ' fav' : '') + '">' + U.fmtOdds(od.tansho[ru.num]) + '</span></td></tr>';
        if (this.openDetail === ru.num) {
          h += '<tr class="detail"><td colspan="10"><div class="small" style="margin-bottom:8px">📋 パドック: <b>' + esc(cv.label) + '</b> 「' + esc(ru.condComment || '') + '」 ・ 道悪適性 <b>' + hs.mud + '</b></div><div class="stat-bars">' + statBar('スピード', hs.spd) + statBar('スタミナ', hs.sta) + statBar('加速力', hs.acc) + statBar('コーナー', hs.cor) + statBar('末脚', hs.kick) + '</div>' +
            '<div class="row" style="margin-top:10px"><span class="small muted grow">能力の目安 <b class="rank-letter ' + rank + '">' + rank + '</b>・複勝 ' + U.fmtOdds(od.fukusho[ru.num]) + '倍・想定勝率 ' + (od.winProb[ru.num] * 100).toFixed(1) + '%</span>' +
            '<button class="btn btn-sm btn-gold" data-quick="' + ru.num + '">この馬の単勝を買う</button></div></td></tr>';
        }
      });
      h += '</tbody></table><p class="small muted">印のマスをタップすると ◎→○→▲→△→☆→なし と切り替わります（◎は1頭のみ。ほかに◎があると○から）。行をタップすると能力の詳細を表示します。<br>能力の目安: S＞A＞B＞C＞D。道悪＝重い馬場の得意度（A得意〜D苦手）。気配＝パドック解説の見立て（◎絶好〜✕不安。当たらないこともあります）。</p>';
      box.innerHTML = h;
      box.querySelectorAll('tr.runner').forEach((tr) => tr.addEventListener('click', () => {
        const n = Number(tr.dataset.num);
        this.openDetail = this.openDetail === n ? null : n;
        this.renderRunners(box);
      }));
      box.querySelectorAll('[data-mark]').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        RRG.game.cycleMark(Number(b.dataset.mark));
        RRG.audio.click();
        this.renderRunners(box);
      }));
      box.querySelectorAll('[data-quick]').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        this.bet.type = 'tansho'; this.bet.mode = 'normal'; this.bet.sel = [Number(b.dataset.quick)];
        this.cardTab = 'bet'; this.renderCard();
      }));
    },

    betSelection() {
      const b = this.bet;
      if (b.mode === 'formation') return b.form.slice(0, B.TYPE[b.type].pick);
      return b.sel;
    },

    renderBetting(box) {
      const g = RRG.game, r = g.current(), b = this.bet, T = B.TYPE[b.type];
      const k = T.pick;
      const modes = k === 1 ? [['normal', '通常'], ['box', 'まとめ買い']] : [['normal', '通常'], ['box', 'ボックス'], ['formation', 'フォーメーション']];
      if (!modes.some((m) => m[0] === b.mode)) b.mode = 'normal';
      const oddsOf = (num) => b.type === 'fukusho' ? r.odds.fukusho[num] : r.odds.tansho[num];
      let h = '<div class="panel"><div class="bet-types">' + D.BET_TYPES.map((t) => '<button data-bt="' + t.id + '" class="' + (t.id === b.type ? 'on' : '') + '">' + t.name + '</button>').join('') + '</div>' +
        '<p class="bt-desc"><b>' + T.name + '</b>：' + T.desc + (T.ordered && b.mode === 'normal' ? '（タップした順に 1着→' + (k === 3 ? '2着→3着' : '2着') + '）' : '') + '</p>' +
        '<div class="modes">' + modes.map((m) => '<button data-mode="' + m[0] + '" class="' + (b.mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>').join('') + '</div>' +
        '<div class="sort-row"><span class="small muted">並び順</span><div class="seg">' + [['num', '馬番順'], ['pop', '人気順']].map(([v, l]) => '<button data-sort="' + v + '" class="' + ((b.sort || 'num') === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
      // 並び順（人気順を選ぶと、すべての選択欄が1番人気から並ぶ）
      const runners = b.sort === 'pop' ? r.runners.slice().sort((x, y) => r.odds.popularity[x.num] - r.odds.popularity[y.num]) : r.runners;
      const pickBtn = (ru, on, ord, compact) => {
        const hs = g.horse(ru.horseId);
        const pop = r.odds.popularity[ru.num];
        if (compact) {
          // フォーメーション用: 馬番・人気・単勝オッズ・馬名を小さく表示
          return '<button class="pick compact' + (on ? ' on' : '') + '" data-num="' + ru.num + '" title="' + esc(hs.name) + '">' + chip(ru.num, ru.waku) +
            '<div class="pc-info"><b class="' + (pop <= 3 ? 'top' : '') + '">' + pop + '人気</b><span>' + U.fmtOdds(r.odds.tansho[ru.num]) + '</span></div>' +
            '<div class="pc-name">' + esc(hs.name) + '</div></button>';
        }
        return '<button class="pick' + (on ? ' on' : '') + '" data-num="' + ru.num + '">' + chip(ru.num, ru.waku) +
          '<div style="min-width:0"><div class="pn">' + esc(hs.name) + '</div><div class="po">' + (k === 1 ? (b.type === 'fukusho' ? '複' : '単') + ' ' + U.fmtOdds(oddsOf(ru.num)) + '倍・' + pop + '人気' : '単 ' + U.fmtOdds(r.odds.tansho[ru.num]) + '・' + pop + '人気') + '</div></div>' +
          (ord ? '<span class="ord">' + ord + '</span>' : '') + '</button>';
      };
      if (b.mode === 'formation') {
        const labels = T.ordered ? ['1着', '2着', '3着'] : ['1頭目', '2頭目', '3頭目'];
        h += '<div class="form-cols">' + [...Array(k).keys()].map((ci) => '<div class="form-col" data-col="' + ci + '"><h4>' + labels[ci] +
          '<span class="small muted">' + (b.form[ci].length ? b.form[ci].length + '頭選択' : '') + '</span></h4><div class="pick-grid">' +
          runners.map((ru) => pickBtn(ru, b.form[ci].indexOf(ru.num) >= 0, null, true)).join('') + '</div></div>').join('') + '</div>';
      } else {
        h += '<div class="pick-grid" id="bt-grid">' + runners.map((ru) => {
          const i = b.sel.indexOf(ru.num);
          const ord = i >= 0 && T.ordered && b.mode === 'normal' ? (i + 1) + '着' : null;
          return pickBtn(ru, i >= 0, ord, false);
        }).join('') + '</div>';
      }
      // 購入内容
      const combos = B.buildCombos(b.type, b.mode, this.betSelection());
      const n = combos.length;
      let oddsTxt = '—';
      if (n === 1) oddsTxt = U.fmtOdds(RRG.odds.lookup(r.odds, b.type, combos[0])) + '倍';
      else if (n > 1) {
        const os = combos.map((c) => RRG.odds.lookup(r.odds, b.type, c));
        oddsTxt = U.fmtOdds(Math.min(...os)) + '〜' + U.fmtOdds(Math.max(...os)) + '倍';
      }
      const total = n * b.stake;
      const after = g.save.coins - total;
      h += '<div class="slip"><div class="cell"><div class="k">購入点数</div><div class="v">' + n + '点</div></div>' +
        '<div class="cell"><div class="k">オッズ（購入時に確定）</div><div class="v" style="font-size:' + (n > 1 ? '16' : '20') + 'px">' + oddsTxt + '</div></div>' +
        '<div class="cell wide"><div class="k">1点あたりの賭け金（100コイン単位）</div><div class="stake" style="margin-top:6px"><button class="sbtn" id="st-minus">−</button><input id="st-input" type="number" inputmode="numeric" min="100" step="100" value="' + b.stake + '"><button class="sbtn" id="st-plus">＋</button><span class="muted small">コイン</span></div>' +
        '<div class="chips">' + [100, 500, 1000, 5000, 10000].map((v) => '<button data-stake="' + v + '">' + U.fmtCoin(v) + '</button>').join('') + '<button data-stake="+1000">+1,000</button></div></div>' +
        '<div class="cell"><div class="k">合計金額</div><div class="v">' + U.fmtCoin(total) + '</div></div>' +
        '<div class="cell"><div class="k">購入後の残り</div><div class="v ' + (after < 0 ? 'minus' : '') + '">' + U.fmtCoin(after) + '</div></div></div>' +
        (n === 1 ? '<div class="small muted" style="margin-top:8px">的中時の払戻: ' + U.fmtCoin(B.payoutOf(b.stake, RRG.odds.lookup(r.odds, b.type, combos[0]))) + 'コイン（利益 ' + signed(B.payoutOf(b.stake, RRG.odds.lookup(r.odds, b.type, combos[0])) - b.stake) + '）</div>' : '') +
        (n > 1 ? (() => {
          // 買い目ごとのオッズ一覧（オッズの高い順・最大60点まで表示）
          const list = combos.map((c) => ({ c, o: RRG.odds.lookup(r.odds, b.type, c) })).sort((x, y) => x.o - y.o);
          const sep = T.ordered ? '→' : '-';
          return '<details class="combo-list"' + (n <= 12 ? ' open' : '') + '><summary>買い目とオッズ一覧（' + n + '点・低オッズ順）</summary><div class="cl-grid">' +
            list.slice(0, 60).map((x) => '<div><span>' + x.c.join(sep) + '</span><b>' + U.fmtOdds(x.o) + '倍</b><small>' + U.fmtCoin(B.payoutOf(b.stake, x.o)) + '</small></div>').join('') +
            '</div>' + (n > 60 ? '<p class="small muted">ほか ' + (n - 60) + '点</p>' : '') + '</details>';
        })() : '') +
        '<div class="btn-row">' + (Object.keys(r.marks || {}).length ? '<button class="btn btn-green" id="bt-marks">印から選ぶ</button>' : '') + '<button class="btn" id="bt-clear">選択をクリア</button><button class="btn btn-gold btn-lg" id="bt-buy"' + (n && after >= 0 ? '' : ' disabled') + '>購入する（' + n + '点 / ' + U.fmtCoin(total) + '）</button></div></div>';
      // 購入済み
      h += '<h2 class="sec" style="margin-top:22px">購入済み馬券（' + r.tickets.length + '件）</h2>';
      if (!r.tickets.length) h += '<p class="muted small">まだ購入していません。締切前ならいつでも取り消せます。</p>';
      r.tickets.forEach((t) => {
        const d = B.describeTicket(t);
        const odds = t.combos.length === 1 ? U.fmtOdds(t.combos[0].odds) + '倍' : t.combos.length + '点';
        h += '<div class="ticket"><div class="tt">' + d.name + '</div><div class="ts">' + esc(d.sel) + '<small>' + d.modeName + '・1点' + U.fmtCoin(t.stakePer) + '・' + odds + '</small></div><div class="tv">' + U.fmtCoin(t.total) + '</div><button class="x" data-cancel="' + t.id + '" title="取り消し">×</button></div>';
      });
      box.innerHTML = h;

      // イベント
      box.querySelectorAll('[data-bt]').forEach((e) => e.addEventListener('click', () => {
        RRG.audio.click();
        if (b.type !== e.dataset.bt) { b.type = e.dataset.bt; b.sel = []; b.form = [[], [], []]; }
        this.renderBetting(box);
      }));
      box.querySelectorAll('[data-sort]').forEach((e) => e.addEventListener('click', () => { RRG.audio.click(); b.sort = e.dataset.sort; this.renderBetting(box); }));
      box.querySelectorAll('[data-mode]').forEach((e) => e.addEventListener('click', () => { RRG.audio.click(); b.mode = e.dataset.mode; b.sel = []; b.form = [[], [], []]; this.renderBetting(box); }));
      if (b.mode === 'formation') {
        box.querySelectorAll('.form-col').forEach((col) => {
          const ci = Number(col.dataset.col);
          col.querySelectorAll('.pick').forEach((p) => p.addEventListener('click', () => {
            const num = Number(p.dataset.num);
            const arr = b.form[ci], i = arr.indexOf(num);
            if (i >= 0) arr.splice(i, 1); else arr.push(num);
            RRG.audio.click(); this.renderBetting(box);
          }));
        });
      } else {
        box.querySelectorAll('#bt-grid .pick').forEach((p) => p.addEventListener('click', () => {
          const num = Number(p.dataset.num);
          const i = b.sel.indexOf(num);
          if (k === 1 && b.mode === 'normal') b.sel = i >= 0 ? [] : [num];
          else if (i >= 0) b.sel.splice(i, 1);
          else if (b.mode === 'normal' && b.sel.length >= k) { RRG.audio.error(); this.toast(T.name + 'は' + k + '頭を選びます（解除してから選び直してください）', 'err'); return; }
          else b.sel.push(num);
          RRG.audio.click(); this.renderBetting(box);
        }));
      }
      const setStake = (v) => { b.stake = U.clamp(Math.round(v / 100) * 100, 100, 1000000); this.renderBetting(box); };
      $('#st-minus').addEventListener('click', () => setStake(b.stake - 100));
      $('#st-plus').addEventListener('click', () => setStake(b.stake + 100));
      $('#st-input').addEventListener('change', (e) => {
        const v = Number(e.target.value);
        if (!Number.isFinite(v) || v < 100) { this.toast('最小賭け金は100コインです', 'err'); setStake(100); return; }
        if (v % 100) this.toast('100コイン単位に調整しました');
        setStake(v);
      });
      box.querySelectorAll('[data-stake]').forEach((e) => e.addEventListener('click', () => {
        const s = e.dataset.stake;
        setStake(s[0] === '+' ? b.stake + Number(s.slice(1)) : Number(s));
      }));
      $('#bt-clear').addEventListener('click', () => { b.sel = []; b.form = [[], [], []]; this.renderBetting(box); });
      const bm = $('#bt-marks');
      if (bm) bm.addEventListener('click', () => {
        // 通常で印の数が足りない／多い券種はボックスに切り替えて印の馬を選ぶ
        let mode = b.mode;
        const nm = Object.keys(r.marks).length;
        if (mode === 'normal' && nm > k) mode = 'box';
        if (nm < k) { RRG.audio.error(); this.toast(T.name + 'は印が' + k + '頭以上必要です（出走表の「印」で付けられます）', 'err', 3000); return; }
        const sel = RRG.game.marksSelection(b.type, mode);
        if (!sel) return;
        b.mode = mode;
        if (mode === 'formation') { b.form = [sel[0] || [], sel[1] || [], sel[2] || []]; }
        else b.sel = sel.slice();
        RRG.audio.click();
        this.toast('印の馬を選択しました（' + (mode === 'box' ? 'ボックス' : mode === 'formation' ? 'フォーメーション：1列目◎、2列目◎○▲、3列目 印すべて' : '通常') + '）');
        this.renderBetting(box);
      });
      const buyBtn = $('#bt-buy');
      buyBtn.addEventListener('click', () => {
        buyBtn.disabled = true; // 二重購入防止
        const res = RRG.game.buy(b.type, b.mode, this.betSelection(), b.stake);
        if (!res.ok) { RRG.audio.error(); this.toast(res.error, 'err'); this.renderBetting(box); return; }
        RRG.audio.coin();
        const d = B.describeTicket(res.ticket);
        this.toast(d.name + ' ' + d.sel + ' を購入しました（' + U.fmtCoin(res.ticket.total) + '）', 'good');
        b.sel = []; b.form = [[], [], []];
        this.renderCard();
      });
      box.querySelectorAll('[data-cancel]').forEach((e) => e.addEventListener('click', () => {
        const res = RRG.game.cancel(e.dataset.cancel);
        if (!res.ok) { this.toast(res.error, 'err'); return; }
        RRG.audio.click(); this.toast('馬券を取り消し、返金しました');
        this.renderCard();
      }));
    },

    ticketListHtml(race, settlement) {
      if (!race.tickets.length) return '<p class="muted">馬券は購入していません。</p>';
      return race.tickets.map((t, i) => {
        const d = B.describeTicket(t);
        const res = settlement ? settlement.results[i] : null;
        const odds = t.combos.length === 1 ? U.fmtOdds(t.combos[0].odds) + '倍' : t.combos.length + '点';
        let right = U.fmtCoin(t.total);
        if (res) right = res.hit ? '<span class="plus">' + U.fmtCoin(res.payout) + '</span><small class="muted" style="display:block;font-size:10px">払戻</small>' : '<span class="muted">0</span>';
        const hitInfo = res && res.hit ? '<small style="color:#5ee6a3">的中: ' + res.hits.map((x) => x.nums.join(B.TYPE[t.type].ordered ? '→' : '-') + '（' + U.fmtOdds(x.odds) + '倍）').join('、') + '</small>' : '';
        return '<div class="ticket ' + (res ? (res.hit ? 'hit' : 'miss') : '') + '">' + (res ? '<span class="stamp ' + (res.hit ? 'hit' : 'miss') + '">' + (res.hit ? '的中' : 'ハズレ') + '</span>' : '') +
          '<div class="tt">' + d.name + '</div><div class="ts">' + esc(d.sel) + '<small>' + d.modeName + '・1点' + U.fmtCoin(t.stakePer) + '・' + odds + '・購入' + U.fmtCoin(t.total) + '</small>' + hitInfo + '</div><div class="tv">' + right + '</div></div>';
      }).join('');
    },

    confirmClose() {
      const g = RRG.game, r = g.current();
      if (!r || r.status !== 'open') return;
      const total = g.ticketTotal();
      const body = (r.tickets.length ? '<p>以下の内容で馬券の発売を締め切り、レースを開始します。締切後は追加購入・取り消しはできません。</p>' + this.ticketListHtml(r) +
        '<p style="text-align:right;margin-top:10px">合計 <b style="font-size:20px">' + U.fmtCoin(total) + '</b> コイン</p>'
        : '<p>馬券を購入していません。このまま観戦のみ行いますか？</p>');
      this.confirm('締切・発走の確認', body, '締め切って発走', () => {
        if (!g.close()) { this.toast('締切処理に失敗しました', 'err'); return; }
        this.runRace();
      });
    },

    // ---------- 観戦 ----------
    runRace() {
      const g = RRG.game, r = g.current();
      if (!r) return;
      const sim = this.sim = g.runSim(r, true);
      this.show('race');
      this._replayOnly = false;
      this.ensureView();
      try {
        this.view.done = false;
        this.view.load(r, sim, g.save.settings);
        this.view.start();
      } catch (e) {
        console.error(e);
        this.toast('レース映像を表示できませんでした。結果のみ表示します。', 'err', 4000);
        this.afterRace();
      }
    },
    ensureView() {
      const g = RRG.game;
      if (!this.view) {
        this.view = new RRG.RaceView($('#race-stage'), {
          onFinish: () => this.afterRace(),
          replayOnly: () => this._replayOnly,
          onReplay: () => {
            const got = g.missionEvent('replay');
            g.persist();
            got.forEach((m) => this.toast('🎯 ミッション達成「' + m.text + '」', 'good', 3000));
          },
          onShowTickets: () => {
            const cur = g.current();
            this.modal({ title: '購入した馬券（締切済み）', body: this.ticketListHtml(cur), buttons: [{ label: '閉じる', cls: 'btn-gold' }] });
          },
          onNotice: (m) => this.toast(m, '', 4000),
          onError: (e) => { this.toast('描画エラーのため結果画面へ移動します', 'err', 4000); this.afterRace(); },
        });
      }
      return this.view;
    },
    afterRace() {
      const g = RRG.game;
      if (this.view) this.view.stop();
      // リプレイから戻ったときは精算・演出を繰り返さない
      const cur = g.current();
      if (cur && cur.settled) { this._replayOnly = false; this.renderResult(cur.settlement); this.show('result'); return; }
      const st = g.settle(this.sim || g.runSim(g.current(), false));
      if (!st) { this.goMenu(); return; }
      this.renderResult(st);
      this.show('result');
      const hit = st.results.some((x) => x.hit);
      const big = st.totalPayout >= 30000 || (st.totalBet > 0 && st.totalPayout >= st.totalBet * 10);
      if (hit) {
        RRG.audio.win(big);
        RRG.fx.confetti(big ? 260 : 120);
        if (big) RRG.fx.bigWin(st.totalPayout);
      } else if (st.totalBet > 0) RRG.audio.lose();
      (st.newAchievements || []).forEach((a, i) => setTimeout(() => this.toast('🏆 実績解除「' + a.name + '」', 'good', 3200), 900 + i * 700));
      (st.newUnlocks || []).forEach((v, i) => setTimeout(() => this.toast('🏟️ ' + v.name + ' が開放されました！', 'good', 3600), 1500 + i * 700));
      if (st.seasonEnd) setTimeout(() => this.showSeasonEnd(st.seasonEnd), 1800);
      (st.missions || []).forEach((m, i) => setTimeout(() => this.toast('🎯 ミッション達成「' + m.text + '」 メニューで報酬を受け取れます', 'good', 3600), 1200 + i * 800));
    },

    // 結果画面からゴールのリプレイを見る
    replayFromResult() {
      const g = RRG.game, r = g.current();
      if (!r || !r.settled) return;
      if (!this.sim || !this.sim.frames || !this.view || this.view.race !== r) {
        this.sim = g.runSim(r, true);
        this.show('race');
        this.ensureView();
        this.view.load(r, this.sim, g.save.settings);
      } else this.show('race');
      this._replayOnly = true;
      this.view.done = false;
      this.view.startReplay();
      this.view.start();
    },

    showSeasonEnd(se) {
      const t = se.title;
      this.modal({
        title: '🏆 グランプリシーズン 第' + se.entry.no + '期 終了',
        body: '<div style="text-align:center"><div class="muted">シーズン収支</div><div style="font-size:30px;font-weight:900" class="' + (se.entry.profit >= 0 ? 'plus' : 'minus') + '">' + signed(se.entry.profit) + '</div>' +
          '<div class="muted" style="margin-top:10px">獲得した称号</div><div class="title-badge big" style="--tc:' + t.color + '">' + esc(t.name) + '</div>' +
          '<div class="small muted" style="margin-top:10px">購入 ' + U.fmtCoin(se.entry.bet) + ' ／ 払戻 ' + U.fmtCoin(se.entry.payout) + ' ／ 的中 ' + se.entry.hits + 'レース' + (se.rank ? ' ／ ランキング ' + se.rank + '位' : '') + '</div></div>',
        buttons: [{ label: 'シーズン画面へ', onClick: () => { this.renderSeason(); this.show('season'); } }, { label: '閉じる', cls: 'btn-gold' }],
      });
      RRG.audio.win(true);
      RRG.fx.confetti(200);
    },

    // ---------- 結果 ----------
    renderResult(st) {
      const g = RRG.game, r = g.current();
      if (!r || !r.result) { this.goMenu(); return; }
      const v = g.venue(r.venueId);
      const order = r.result.order, times = r.result.times;
      const my = new Set();
      r.tickets.forEach((t) => t.combos.forEach((c) => c.nums.forEach((n) => my.add(n))));
      const hit = st.results.some((x) => x.hit);
      let h = '<div class="wrap"><div class="result-hero"><div class="muted">' + esc(v.short + ' ' + r.no + 'R ' + r.name) + ' <span class="grade ' + r.grade + '">' + esc(r.grade) + '</span></div>' +
        '<div class="big ' + (hit ? 'win' : 'lose') + '">' + (st.totalBet === 0 ? 'レース確定' : hit ? '的中！' : '残念…') + '</div>' +
        (hit && st.profit < 0 ? '<div class="muted">的中しましたが購入額を下回りました（トリガミ）</div>' : '') + '</div>';
      h += '<div class="panel"><div class="sumgrid">' +
        '<div class="cell"><div class="k">購入合計</div><div class="v">' + U.fmtCoin(st.totalBet) + '</div></div>' +
        '<div class="cell"><div class="k">払戻合計</div><div class="v ' + (st.totalPayout ? 'plus' : '') + '">' + U.fmtCoin(st.totalPayout) + '</div></div>' +
        '<div class="cell"><div class="k">レース収支</div><div class="v ' + (st.profit > 0 ? 'plus' : st.profit < 0 ? 'minus' : '') + '">' + signed(st.profit) + '</div></div>' +
        '<div class="cell"><div class="k">所持コイン</div><div class="v">' + U.fmtCoin(g.save.coins) + '</div></div></div></div>';
      h += '<div class="grid2" style="margin-top:14px"><div class="panel"><h2 class="sec">着順</h2><div class="scroll-x"><table class="res-table"><thead><tr><th>着</th><th>馬番</th><th>馬名</th><th>騎手</th><th class="num">タイム</th><th class="num">着差</th><th class="num">人気</th><th class="num">単勝</th></tr></thead><tbody>';
      order.forEach((num, i) => {
        const ru = r.runners.find((x) => x.num === num), hs = g.horse(ru.horseId);
        const margin = i === 0 ? '' : U.marginText(times[num] - times[order[i - 1]]);
        h += '<tr class="' + (my.has(num) ? 'mine' : '') + '"><td class="pos">' + (i + 1) + '</td><td>' + chip(num, ru.waku) + '</td><td><b>' + esc(hs.name) + '</b></td><td class="muted">' + esc(hs.jockey) + '</td>' +
          '<td class="num">' + U.fmtTime(times[num]) + '</td><td class="num">' + margin + '</td><td class="num">' + r.odds.popularity[num] + '</td><td class="num">' + U.fmtOdds(r.odds.tansho[num]) + '</td></tr>';
      });
      h += '</tbody></table></div></div><div class="panel"><h2 class="sec">あなたの馬券</h2>' + this.ticketListHtml(r, st) + '</div></div>';
      // ゴール写真と通過順位グラフ
      const photo = this.view && this.view.race === r && this.view.photoUrl;
      h += '<div class="grid2" style="margin-top:14px">' +
        '<div class="panel"><h2 class="sec">ゴール写真</h2>' + (photo ? '<img class="result-photo" alt="ゴール写真" src="' + photo + '">' : '<p class="muted small">リプレイを見ると、ゴールの瞬間を確認できます。</p>') +
        '<button class="btn btn-block" id="rs-replay" style="margin-top:10px">🔁 ゴールをリプレイ（複数アングル）</button></div>' +
        '<div class="panel"><h2 class="sec">位置取りの推移</h2>' + passingChart(r, my) + '</div></div>';
      // 公式払戻（100コインあたり）
      const wc = B.winningCombos(order, r.runners.length);
      h += '<div class="panel" style="margin-top:14px"><h2 class="sec">払戻金（100コインあたり）</h2><div class="scroll-x"><table class="res-table"><tbody>';
      D.BET_TYPES.forEach((t) => {
        wc[t.id].forEach((nums, j) => {
          const o = RRG.odds.lookup(r.odds, t.id, nums);
          h += '<tr><td>' + (j === 0 ? '<b style="color:var(--gold2)">' + t.name + '</b>' : '') + '</td><td>' + nums.join(t.ordered ? '→' : '-') + '</td><td class="num">' + U.fmtCoin(B.payoutOf(100, o)) + '</td><td class="num muted">' + U.fmtOdds(o) + '倍</td></tr>';
        });
      });
      h += '</tbody></table></div><p class="small muted">※ゲーム内の仮想・固定オッズによる払戻です。払戻額 ＝ 賭け金 × 購入時オッズ、利益 ＝ 払戻額 − 購入金額。</p></div>';
      const nextSeason = r.season ? g.seasonNext() : null;
      h += '<div class="btn-row"><button class="btn btn-gold btn-lg" id="rs-next">' + (r.season ? (nextSeason && g.season().no === r.season.no ? 'シーズン次戦へ ▶' : 'シーズン画面へ ▶') : '次のレースへ ▶') + '</button><button class="btn btn-lg" id="rs-menu">メニューに戻る</button></div></div>';
      $('#scr-result').innerHTML = h;
      $('#rs-replay').addEventListener('click', () => { RRG.audio.click(); this.replayFromResult(); });
      $('#rs-next').addEventListener('click', () => {
        RRG.audio.click(); const vid = r.venueId; g.finishRace();
        if (r.season) { if (nextSeason && g.season().no === r.season.no) this.startSeasonRace(); else { this.renderSeason(); this.show('season'); } }
        else this.newRace(vid);
      });
      $('#rs-menu').addEventListener('click', () => { RRG.audio.click(); g.finishRace(); this.renderMenu(); this.show('menu'); });
    },

    // ---------- 戦績 ----------
    renderStats() {
      const g = RRG.game, S = g.save.stats;
      const profit = S.totalPayout - S.totalBet;
      const rate = S.totalBet ? (S.totalPayout / S.totalBet * 100).toFixed(1) + '%' : '—';
      const hitRate = S.betRaces ? (S.hitRaces / S.betRaces * 100).toFixed(1) + '%' : '—';
      let h = '<div class="wrap"><h2 class="sec">戦績・収支</h2><div class="panel"><div class="sumgrid">' +
        [['総レース数', S.races], ['購入レース数', S.betRaces], ['総購入額', U.fmtCoin(S.totalBet)], ['総払戻額', U.fmtCoin(S.totalPayout)],
          ['通算利益', '<span class="' + (profit >= 0 ? 'plus' : 'minus') + '">' + signed(profit) + '</span>'], ['回収率', rate], ['レース的中率', hitRate],
          ['最高払戻額', U.fmtCoin(S.maxPayout)], ['最大連続的中', S.maxStreak + 'レース'], ['所持コイン', U.fmtCoin(g.save.coins)]]
          .map(([k, v]) => '<div class="cell"><div class="k">' + k + '</div><div class="v" style="font-size:18px">' + v + '</div></div>').join('') + '</div>' +
        (S.maxPayoutDesc ? '<p class="small muted">最高払戻: ' + esc(S.maxPayoutDesc) + '</p>' : '') + '</div>';
      h += '<div class="panel" style="margin-top:14px"><h2 class="sec">馬券種別の成績</h2><div class="scroll-x"><table class="res-table"><thead><tr><th>券種</th><th class="num">購入点数</th><th class="num">的中</th><th class="num">的中率</th><th class="num">購入額</th><th class="num">払戻額</th><th class="num">回収率</th></tr></thead><tbody>';
      D.BET_TYPES.forEach((t) => {
        const x = S.byType[t.id];
        h += '<tr><td><b>' + t.name + '</b></td><td class="num">' + x.tickets + '</td><td class="num">' + x.hits + '</td><td class="num">' + (x.tickets ? (x.hits / x.tickets * 100).toFixed(1) + '%' : '—') + '</td><td class="num">' + U.fmtCoin(x.bet) + '</td><td class="num">' + U.fmtCoin(x.payout) + '</td><td class="num">' + (x.bet ? (x.payout / x.bet * 100).toFixed(0) + '%' : '—') + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
      h += '<div class="panel" style="margin-top:14px"><h2 class="sec">最近のレース</h2>';
      if (!S.recent.length) h += '<p class="muted">まだレース結果がありません。</p>';
      else {
        h += '<div class="scroll-x"><table class="res-table"><thead><tr><th>レース</th><th>勝ち馬</th><th>1-2-3着</th><th class="num">購入</th><th class="num">払戻</th><th class="num">収支</th></tr></thead><tbody>';
        S.recent.slice(0, 15).forEach((x) => {
          const p = x.payout - x.bet;
          h += '<tr><td>' + esc(x.venue + ' ' + x.no + 'R ' + x.name) + '</td><td>' + x.winnerNum + ' ' + esc(x.winner) + '</td><td>' + x.order.join('-') + '</td><td class="num">' + U.fmtCoin(x.bet) + '</td><td class="num">' + U.fmtCoin(x.payout) + '</td><td class="num ' + (p > 0 ? 'plus' : p < 0 ? 'minus' : '') + '">' + (x.bet ? signed(p) : '—') + '</td></tr>';
        });
        h += '</tbody></table></div>';
      }
      h += '</div><div class="panel" style="margin-top:14px"><h2 class="sec">実績</h2><div class="ach">' +
        RRG.game.ACHIEVEMENTS.map((a) => '<div class="' + (g.save.achievements[a.id] ? 'got' : '') + '"><b>' + (g.save.achievements[a.id] ? '🏆 ' : '🔒 ') + a.name + '</b>' + a.desc + '</div>').join('') + '</div></div></div>';

        RRG.audio.speak('最後の直線に向いた！ 先頭は3番 ルミナスギャラント、外から7番 フロストティアラが伸びてくる！', 2);
      });
      $('#st-fixed').addEventListener('click', () => {
        RRG.audio.unlock();
        this.newRace('suirei', { seed: 20261028, fieldSize: 10, fixedTest: true, name: 'テスト固定レース', grade: 'オープン' });
      });
      $('#st-reset').addEventListener('click', () => {
        this.confirm('データを初期化しますか？', 'コイン・戦績・実績・設定がすべて消去され、元に戻せません。', '次へ', () => {
          this.confirm('本当に初期化しますか？', '<b style="color:#ff8a8a">最終確認です。</b>この操作は取り消せません。', '完全に初期化する', () => {
            g.resetAll(); RRG.audio.setVolumes(g.save.settings);
            this.updateCoins(true);
            this.toast('データを初期化しました（10,000コインで再スタート）', 'good');
            this.goMenu();
          }, 'btn-red');
        }, 'btn-red');
      });
    },
  };

  function heroHorseSVG() {
    // 装飾用のシルエット（ゴールド）
    return '<svg class="hero-horse" viewBox="0 0 520 120" aria-hidden="true"><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#f0cf6a"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs>' +
      '<rect x="0" y="108" width="520" height="2" fill="url(#hg)"/>' +
      '<g fill="#d4af37" opacity=".9" transform="translate(190,8)">' +
      '<path d="M18 62c10-10 30-16 52-16 14 0 26 2 38 0 10-2 18-10 26-20 4-5 6-12 12-14 6-1 10 2 14 6l8 6c3 3 1 7-3 7l-10-1c-4 0-6 3-8 6-6 10-12 18-20 24 4 8 6 14 4 20l-6 20c-1 3-5 3-6 0l2-16c0-4-2-8-6-10-12 6-28 8-42 8-6 8-14 14-22 18l-10 16c-2 3-6 2-6-1l4-16c-8 0-16-2-22-8-8 4-18 4-26 2l-6 14c-1 3-6 2-6-1l2-16c-6-6-4-14 2-20z"/>' +
      '<path d="M86 34c-6-6-6-14 0-18 6-4 12-2 14 4l2 12c-4 2-10 4-16 2z"/></g></svg>';
  }

  // ---------- 演出（紙吹雪・高額払戻） ----------
  const fx = {
    parts: [], raf: null,
    confetti(n) {
      const c = $('#fx-canvas'), g = c.getContext('2d');
      c.width = innerWidth; c.height = innerHeight;
      const cols = ['#f0cf6a', '#d4af37', '#ffffff', '#3ccf8e', '#e0474c', '#3d8bfd'];
      for (let i = 0; i < n; i++) this.parts.push({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, c: cols[i % cols.length], life: 4 + Math.random() * 2 });
      if (this.raf) return;
      let last = performance.now();
      const step = (t) => {
        const dt = Math.min(0.05, (t - last) / 1000); last = t;
        g.clearRect(0, 0, c.width, c.height);
        this.parts = this.parts.filter((p) => (p.life -= dt) > 0 && p.y < c.height + 30);
        this.parts.forEach((p) => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr; p.vx *= 0.995;
          g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life); g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
        });
        if (this.parts.length) this.raf = requestAnimationFrame(step); else { this.raf = null; g.clearRect(0, 0, c.width, c.height); }
      };
      this.raf = requestAnimationFrame(step);
    },
    bigWin(amount) {
      const d = document.createElement('div');
      d.className = 'bigwin';
      d.innerHTML = '<div>高額払戻！<small>+' + U.fmtCoin(amount) + ' COINS</small></div>';
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2800);
    },
  };

  RRG.ui = UI;
  RRG.fx = fx;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/main.js */
/* main.js — 起動処理 */
(function () {
  'use strict';
  function fatal(e) {
    const box = document.getElementById('boot-error');
    box.hidden = false;
    box.textContent = 'ゲームの起動中にエラーが発生しました。\nページを再読み込みしてください。\n\n' + (e && (e.stack || e.message) || e);
  }
  try {
    const RRG = window.RRG;
    const save = RRG.game.init();
    RRG.audio.setVolumes(save.settings);
    RRG.ui.init();
    // 最初の操作で音声を有効化（ブラウザの自動再生制限対策）
    const unlock = () => { RRG.audio.unlock(); RRG.audio.setVolumes(RRG.game.save.settings); if (RRG.ui.cur === 'menu') RRG.audio.bgmStart(); };
    window.addEventListener('pointerdown', unlock, { once: true });
    window.addEventListener('keydown', unlock, { once: true });

    const r = RRG.game.current();
    RRG.ui.renderMenu();
    RRG.ui.show('menu');
    if (RRG.storage.lastError) RRG.ui.toast(RRG.storage.lastError, 'err', 5000);
    if (r && r.status === 'closed' && !r.settled) {
      RRG.ui.modal({
        title: '前回のレースが未精算です',
        body: '締切済みのレースの結果がまだ確定していません。<br>レースの展開は締切時に確定しているため、観戦しても結果は変わりません。',
        buttons: [
          { label: '結果だけ見る', onClick: () => { RRG.ui.sim = RRG.game.runSim(RRG.game.current(), false); RRG.ui.afterRace(); } },
          { label: '観戦する', cls: 'btn-gold', onClick: () => RRG.ui.runRace() },
        ],
        dismiss: false,
      });
    } else if (r && r.settled) {
      RRG.ui.renderResult(r.settlement);
      RRG.ui.show('result');
    }
    // キーボード操作（PC）
    window.addEventListener('keydown', (e) => {
      const v = RRG.ui.view;
      if (RRG.ui.cur !== 'race' || !v) return;
      if (e.code === 'Space') { e.preventDefault(); v.togglePause(); }
      else if (e.key === 'c' || e.key === 'C') v.cycleCamera();
      else if (e.key === 'f' || e.key === 'F') v.cycleSpeed();
    });
    window.RRG_READY = true;
  } catch (e) {
    console.error(e);
    fatal(e);
  }
  window.addEventListener('error', (ev) => { console.error(ev.error || ev.message); });
})();

</script>
