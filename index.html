<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1a2e">
  <meta name="description" content="3Dの競走馬が駆ける本格競馬シミュレーション＆馬券予想ゲーム（ゲーム内コインのみ・換金なし）">
  <title>リアルレーシング・グランプリ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b1a2e' stroke='%23d4af37' stroke-width='4'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23d4af37' font-family='serif' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E">
  <style>
/* ===== リアルレーシング・グランプリ スタイル ===== */
:root {
  --navy: #0b1a2e;
  --navy2: #12253f;
  --navy3: #1a3253;
  --green: #0f3d2e;
  --green2: #155540;
  --turf: #2f7a3d;
  --gold: #d4af37;
  --gold2: #f0cf6a;
  --gold3: #a8841f;
  --ivory: #f3efe3;
  --muted: #a9b4c4;
  --red: #e0474c;
  --blue: #3d8bfd;
  --ok: #3ccf8e;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Times New Roman", serif;
  --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ivory); font-family: var(--sans); overscroll-behavior: none; }
body { overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: not-allowed; opacity: .45; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- トップバー ---------- */
#topbar {
  height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: linear-gradient(180deg, #0e2240, #0a1729); border-bottom: 1px solid rgba(212, 175, 55, .35);
  z-index: 20;
}
.tb-home { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, .4); background: rgba(255, 255, 255, .04); font-size: 18px; }
.tb-title { flex: 1; font-family: var(--serif); letter-spacing: .12em; font-weight: 700; font-size: 15px; color: var(--gold2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title span { color: var(--ivory); font-weight: 400; }
.tb-coins { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(212, 175, 55, .5); font-size: 16px; font-variant-numeric: tabular-nums; transition: transform .2s; }
.tb-coins.bump { transform: scale(1.12); }
.tb-coins.low b { color: #ff8a8a; }
.coin-ic { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, var(--gold) 45%, var(--gold3)); box-shadow: inset 0 0 0 2px rgba(120, 80, 0, .35); display: inline-block; flex: 0 0 auto; }
body.racing #topbar { display: none; }

/* ---------- 画面 ---------- */
#screens { flex: 1; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: none; padding: 18px 16px calc(110px + var(--safe-b)); -webkit-overflow-scrolling: touch;
  background: radial-gradient(1200px 600px at 50% -10%, rgba(21, 85, 64, .55), transparent 70%), linear-gradient(180deg, var(--navy) 0%, #0a1625 100%); }
.screen.active { display: block; animation: fadeIn .25s ease; }
#scr-race { padding: 0; background: #000; overflow: hidden; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1060px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--serif); letter-spacing: .06em; }
h2.sec { font-size: 20px; margin: 6px 0 14px; color: var(--gold2); display: flex; align-items: center; gap: 10px; }
h2.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(212, 175, 55, .6), transparent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.panel { background: linear-gradient(180deg, rgba(26, 50, 83, .75), rgba(14, 30, 52, .85)); border: 1px solid rgba(212, 175, 55, .22); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }

/* ---------- ボタン ---------- */
.btn { border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .06); color: var(--ivory); padding: 12px 18px; border-radius: 12px; font-size: 15px; font-weight: 700; letter-spacing: .04em; min-height: 46px; transition: transform .08s, background .2s, box-shadow .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
.btn-gold { background: linear-gradient(180deg, #f4d97a, var(--gold) 55%, #b48a1f); color: #2a1e04; border-color: #ffe9a0; box-shadow: 0 4px 16px rgba(212, 175, 55, .35), inset 0 1px 0 rgba(255, 255, 255, .6); }
.btn-gold:hover:not(:disabled) { background: linear-gradient(180deg, #fae39a, #e0bb45 55%, #bf9325); }
.btn-green { background: linear-gradient(180deg, #2a8c63, #176245); border-color: #48b585; }
.btn-red { background: linear-gradient(180deg, #c8484d, #8f262a); border-color: #e57b7f; }
.btn-ghost { background: transparent; }
.btn-lg { padding: 16px 22px; font-size: 18px; min-height: 58px; border-radius: 14px; }
.btn-sm { padding: 7px 12px; font-size: 13px; min-height: 36px; border-radius: 10px; }
.btn-block { width: 100%; }

/* ---------- メニュー ---------- */
.hero { text-align: center; padding: 26px 10px 16px; position: relative; }
.hero .crest { width: 86px; height: 86px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 42px; font-weight: 700; color: var(--gold2);
  background: radial-gradient(circle at 50% 35%, #183457, #0b1a2e); border: 3px solid var(--gold); box-shadow: 0 0 0 6px rgba(212, 175, 55, .12), 0 10px 30px rgba(0, 0, 0, .5); }
.hero h1 { margin: 6px 0 2px; font-size: clamp(26px, 6vw, 44px); color: var(--ivory); text-shadow: 0 2px 0 rgba(0, 0, 0, .4); }
.hero h1 b { color: var(--gold2); }
.hero .en { font-family: var(--serif); letter-spacing: .4em; color: var(--gold); font-size: 12px; }
.hero .tag { margin-top: 10px; color: var(--muted); font-size: 13px; }
.hero-horse { display: block; margin: 8px auto 0; width: min(520px, 92%); height: auto; opacity: .95; }
.hero-stage { position: relative; width: min(560px, 100%); height: 210px; margin: 4px auto -6px; }
.hero-stage::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: 22px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }
#hero-canvas { width: 100%; height: 100%; display: block; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.menu-card { text-align: left; padding: 18px; border-radius: var(--radius); border: 1px solid rgba(212, 175, 55, .25); background: linear-gradient(160deg, rgba(21, 85, 64, .55), rgba(12, 28, 48, .9)); min-height: 96px; display: flex; gap: 14px; align-items: center; }
.menu-card .ic { font-size: 30px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: rgba(0, 0, 0, .25); border: 1px solid rgba(212, 175, 55, .3); flex: 0 0 auto; }
.menu-card b { display: block; font-size: 17px; font-family: var(--serif); color: var(--gold2); }
.menu-card span { font-size: 12px; color: var(--muted); }
.menu-card.primary { grid-column: 1 / -1; background: linear-gradient(120deg, #1d6b4d, #0f3d2e 55%, #13284a); border-color: var(--gold); min-height: 110px; }
.menu-card.primary b { font-size: 22px; }
.coin-hero { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 6px 0 0; }
.coin-hero .coin-ic { width: 28px; height: 28px; }
.notice { padding: 12px 14px; border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.notice.warn { background: rgba(224, 71, 76, .15); border: 1px solid rgba(224, 71, 76, .5); }
.notice.info { background: rgba(61, 139, 253, .12); border: 1px solid rgba(61, 139, 253, .45); }
.notice.gold { background: rgba(212, 175, 55, .12); border: 1px solid rgba(212, 175, 55, .5); }
.disclaimer { text-align: center; color: #7f8ea3; font-size: 11px; margin-top: 24px; line-height: 1.7; }

/* ---------- 競馬場選択 ---------- */
.venues { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.venue { position: relative; text-align: left; border-radius: var(--radius); overflow: hidden; border: 1px solid rgba(212, 175, 55, .3); padding: 0; background: #0c1b30; min-height: 200px; }
.venue .vimg { height: 112px; position: relative; }
.venue .vbody { padding: 12px 14px 14px; }
.venue b { font-family: var(--serif); font-size: 19px; color: var(--gold2); }
.venue .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.venue.locked { filter: grayscale(.8) brightness(.6); }
.venue .lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 700; background: rgba(0, 0, 0, .35); }

/* ---------- 出走表 ---------- */
.race-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
.race-head .rh-main b { font-family: var(--serif); font-size: 24px; color: var(--ivory); }
.race-head .rh-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.grade { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 800; background: #34465f; color: #fff; vertical-align: middle; margin-left: 6px; }
.grade.G1 { background: linear-gradient(180deg, #2b5fd1, #1b3f94); } .grade.G2 { background: linear-gradient(180deg, #d1342b, #8f1f1a); } .grade.G3 { background: linear-gradient(180deg, #1d9a54, #126a39); }
.tabs { display: flex; gap: 6px; background: rgba(0, 0, 0, .25); padding: 5px; border-radius: 12px; margin-bottom: 14px; border: 1px solid rgba(255, 255, 255, .08); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 11px 8px; border-radius: 9px; font-weight: 700; font-size: 15px; color: var(--muted); min-height: 44px; }
.tabs button.on { background: linear-gradient(180deg, #1d6b4d, #11493a); color: #fff; box-shadow: inset 0 0 0 1px rgba(212, 175, 55, .45); }
.badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--gold); color: #2a1e04; font-size: 12px; margin-left: 4px; }
.card-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.card-table th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: left; padding: 0 8px; white-space: nowrap; }
.card-table td { background: rgba(255, 255, 255, .045); padding: 9px 8px; vertical-align: middle; border-top: 1px solid rgba(255, 255, 255, .05); border-bottom: 1px solid rgba(255, 255, 255, .05); }
.card-table tr.runner { cursor: pointer; }
.card-table tr.runner:hover td { background: rgba(255, 255, 255, .08); }
.card-table td:first-child { border-radius: 10px 0 0 10px; border-left: 1px solid rgba(255, 255, 255, .05); }
.card-table td:last-child { border-radius: 0 10px 10px 0; border-right: 1px solid rgba(255, 255, 255, .05); }
.waku-cell { width: 34px; text-align: center; font-weight: 800; border-radius: 8px !important; }
.num-chip { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 6px; font-weight: 800; font-size: 14px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); font-variant-numeric: tabular-nums; }
.hname { font-weight: 800; font-size: 16px; letter-spacing: .02em; }
.hsub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.silk { display: inline-block; width: 18px; height: 20px; border-radius: 4px 4px 7px 7px; vertical-align: -4px; margin-right: 6px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.style-tag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, .08); white-space: nowrap; }
.style-tag.逃げ { background: rgba(224, 71, 76, .25); } .style-tag.先行 { background: rgba(240, 138, 28, .25); } .style-tag.差し { background: rgba(61, 139, 253, .25); } .style-tag.追込 { background: rgba(140, 79, 168, .3); }
.rank-letter { font-weight: 900; font-family: var(--serif); font-size: 18px; }
.rank-letter.S { color: #ffd36a; } .rank-letter.A { color: #ff9d6a; } .rank-letter.B { color: #8fd3ff; } .rank-letter.C { color: #b9c4d4; } .rank-letter.D { color: #8090a4; }
.odds { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 16px; }
.odds.fav { color: #ff6b6b; }
.pop { font-size: 12px; color: var(--muted); }
.detail td { background: rgba(0, 0, 0, .25) !important; }
.stat-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; }
.sbar { font-size: 12px; }
.sbar .lbl { display: flex; justify-content: space-between; color: var(--muted); }
.sbar .track { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 3px; }
.sbar .fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2a8c63, var(--gold2)); }

/* ---------- 馬券購入 ---------- */
.bet-types { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.bet-types button { padding: 10px 2px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); font-weight: 800; font-size: 14px; min-height: 46px; }
.bet-types button.on { background: linear-gradient(180deg, #f4d97a, var(--gold) 60%, #b48a1f); color: #2a1e04; border-color: #ffe9a0; }
.bt-desc { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.modes { display: flex; gap: 6px; margin-bottom: 12px; }
.modes button { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .14); background: transparent; font-size: 13px; font-weight: 700; min-height: 40px; }
.modes button.on { background: rgba(61, 139, 253, .25); border-color: var(--blue); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pick { position: relative; display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 12px; border: 2px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .05); text-align: left; min-height: 54px; }
.pick .num-chip { width: 32px; height: 32px; font-size: 17px; }
.pick .pn { font-weight: 700; font-size: 13px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .po { font-size: 12px; color: var(--muted); }
.pick.on { border-color: var(--gold); background: rgba(212, 175, 55, .16); }
.pick .ord { position: absolute; top: -8px; right: -6px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.form-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.form-col h4 { margin: 0 0 6px; font-size: 14px; color: var(--gold2); }
.form-col h4 { display: flex; justify-content: space-between; align-items: baseline; }
.form-col .pick-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
.pick.compact { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 2px 6px; padding: 6px 7px; min-height: 52px; align-items: center; }
.pick.compact .num-chip { grid-row: 1 / 3; width: 28px; height: 28px; font-size: 15px; }
.pc-info { display: flex; justify-content: space-between; gap: 4px; font-size: 11px; line-height: 1.2; white-space: nowrap; min-width: 0; }
.pc-info b { font-weight: 800; color: #cfd8e3; }
.pc-info b.top { color: #ff8a7a; }
.pc-info span { font-weight: 800; font-variant-numeric: tabular-nums; }
.pc-name { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sort-row { display: flex; align-items: center; gap: 10px; margin: -2px 0 12px; }
.sort-row .seg button { padding: 6px 12px; min-height: 34px; font-size: 13px; }
.combo-list { margin-top: 10px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .08); border-radius: 10px; padding: 8px 12px; }
.combo-list summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--gold2); padding: 4px 0; }
.cl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin-top: 6px; }
.cl-grid div { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed rgba(255, 255, 255, .08); font-variant-numeric: tabular-nums; }
.cl-grid span { flex: 1; font-weight: 700; }
.cl-grid small { color: var(--muted); font-size: 11px; }
.slip { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slip .cell { background: rgba(0, 0, 0, .25); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, .06); }
.slip .cell .k { font-size: 11px; color: var(--muted); }
.slip .cell .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.slip .wide { grid-column: 1 / -1; }
.stake { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stake input { width: 120px; font-size: 20px; font-weight: 800; text-align: right; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, .5); background: rgba(0, 0, 0, .35); color: var(--ivory); font-family: inherit; }
.stake .sbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .07); font-size: 20px; font-weight: 800; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips button { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(212, 175, 55, .45); background: rgba(212, 175, 55, .08); font-size: 13px; font-weight: 700; min-height: 36px; }
.ticket { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); margin-top: 8px; }
.ticket .tt { font-weight: 800; color: var(--gold2); min-width: 56px; }
.ticket .ts { flex: 1; font-size: 14px; }
.ticket .ts small { display: block; color: var(--muted); font-size: 11px; }
.ticket .tv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.ticket .x { width: 36px; height: 36px; border-radius: 9px; border: 1px solid rgba(224, 71, 76, .5); background: rgba(224, 71, 76, .15); font-weight: 800; }
.ticket.hit { border-color: rgba(60, 207, 142, .6); background: rgba(60, 207, 142, .1); }
.ticket.miss { opacity: .7; }
.stamp { font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 6px; }
.stamp.hit { background: var(--ok); color: #05301c; }
.stamp.miss { background: #4a5568; color: #ddd; }
.sticky-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 10px 14px calc(10px + var(--safe-b)); background: linear-gradient(180deg, rgba(11, 26, 46, .85), rgba(6, 14, 26, .98)); border-top: 1px solid rgba(212, 175, 55, .35); backdrop-filter: blur(8px); display: none; }
.sticky-bar.show { display: block; }
.sticky-bar .inner { max-width: 1060px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.sticky-bar .sum { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.35; }
.sticky-bar .sum b { color: var(--ivory); font-size: 16px; font-variant-numeric: tabular-nums; }

/* ---------- レース観戦 ---------- */
#race-stage { position: absolute; inset: 0; }
.rv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.rv-hud { position: absolute; inset: 0; pointer-events: none; font-size: 13px; }
.rv-hud button { pointer-events: auto; }
.rv-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 10px 12px; background: linear-gradient(180deg, rgba(5, 12, 24, .82), rgba(5, 12, 24, 0)); }
.rv-title { font-size: 14px; text-shadow: 0 1px 3px #000; }
.rv-title b { font-family: var(--serif); color: var(--gold2); font-size: 16px; }
.rv-grade { font-size: 11px; background: rgba(212, 175, 55, .3); padding: 1px 6px; border-radius: 4px; }
.rv-sub { color: #cfd8e3; font-size: 12px; }
.rv-info { text-align: right; text-shadow: 0 1px 3px #000; }

.rv-pos { width: 18px; text-align: right; font-weight: 800; color: var(--gold2); font-variant-numeric: tabular-nums; }
.rv-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-name i { color: var(--gold2); font-style: normal; }
.rv-gap { font-variant-numeric: tabular-nums; color: #cfd8e3; font-size: 11px; min-width: 44px; text-align: right; }
.rv-row.mine { background: rgba(212, 175, 55, .16); }
.rv-row.fin .rv-pos { color: #fff; }
.rv-minimap { position: absolute; right: 10px; top: 92px; width: 176px; height: 96px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, .3); }
.rv-comment { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); max-width: min(720px, 92%); background: rgba(5, 12, 24, .75); border-left: 3px solid var(--gold); padding: 7px 12px; border-radius: 6px; font-size: 14px; font-weight: 700; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-comment.flash { animation: cflash .5s ease; }
@keyframes cflash { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
.rv-progress { position: absolute; left: 12px; right: 12px; bottom: 72px; display: flex; align-items: center; gap: 8px; }
.rv-pl { font-size: 11px; font-weight: 800; color: var(--gold2); }
.rv-bar { position: relative; flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .18); }
.rv-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #2a8c63, var(--gold2)); }
.rv-mark { position: absolute; top: 50%; width: 18px; height: 18px; margin-left: -9px; margin-top: -9px; border-radius: 50%; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 1.5px solid; transition: left .1s linear; }
.rv-mark.mine { box-shadow: 0 0 0 2px var(--gold2); }
.rv-controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px; padding: 8px 8px calc(10px + var(--safe-b)); background: linear-gradient(0deg, rgba(5, 12, 24, .88), rgba(5, 12, 24, 0)); }
.rv-btn { min-width: 62px; height: 52px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, .45); background: rgba(10, 23, 41, .85); font-size: 18px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.rv-btn small { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.rv-btn.off { opacity: .5; }
.rv-labels { position: absolute; inset: 0; overflow: hidden; }
.rv-label { position: absolute; left: 0; top: 0; will-change: transform; }
.rv-label span { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 4px; border-radius: 5px; font-weight: 900; font-size: 13px; box-shadow: 0 2px 4px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(0, 0, 0, .3); }
.rv-label.mine span { box-shadow: 0 0 0 2px var(--gold2), 0 2px 6px rgba(0, 0, 0, .6); }
.rv-label.mine::after { content: "★"; position: absolute; left: 50%; top: -15px; transform: translateX(-50%); color: var(--gold2); font-size: 12px; text-shadow: 0 1px 2px #000; }
.rv-banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.8); opacity: 0; font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 8vw, 64px); letter-spacing: .1em; color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .5), 0 0 24px rgba(0, 0, 0, .6); transition: all .3s ease; white-space: nowrap; }
.rv-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.rv-banner.goal, .rv-banner.start { color: var(--gold2); }
.rv-banner.hot { color: #ff7b6b; }
.rv-board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; width: min(420px, 92%); background: linear-gradient(180deg, rgba(14, 34, 64, .96), rgba(6, 16, 30, .97)); border: 2px solid var(--gold); border-radius: 16px; padding: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .7); transition: all .3s; }
.rv-board.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.rv-board-title { font-family: var(--serif); font-size: 22px; font-weight: 900; color: var(--gold2); text-align: center; letter-spacing: .3em; margin-bottom: 8px; }
.rv-board table { width: 100%; border-collapse: collapse; font-size: 15px; }
.rv-board td { padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.rv-board td.pos { font-family: var(--serif); font-size: 22px; font-weight: 900; color: var(--gold2); width: 34px; text-align: center; }

.rv-photo { text-align: center; padding: 18px 0; font-size: 15px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .4; } }

/* ---------- 結果 ---------- */
.result-hero { text-align: center; padding: 10px 0 16px; }
.result-hero .big { font-family: var(--serif); font-size: clamp(30px, 7vw, 48px); font-weight: 900; }
.result-hero .big.win { color: var(--gold2); text-shadow: 0 0 30px rgba(240, 207, 106, .5); }
.result-hero .big.lose { color: #c5cdd8; }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sumgrid .cell { background: rgba(0, 0, 0, .25); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid rgba(255, 255, 255, .07); }
.sumgrid .k { font-size: 12px; color: var(--muted); }
.sumgrid .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
.plus { color: #5ee6a3; } .minus { color: #ff8a8a; }
.res-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.res-table th { font-size: 11px; color: var(--muted); text-align: left; padding: 6px; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, .1); white-space: nowrap; }
.res-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255, 255, 255, .06); white-space: nowrap; }
.res-table td.pos { font-family: var(--serif); font-weight: 900; font-size: 18px; color: var(--gold2); text-align: center; }
.res-table tr.mine td { background: rgba(212, 175, 55, .1); }
.res-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn-row .btn { flex: 1; min-width: 160px; }

/* ---------- 戦績・図鑑・設定 ---------- */
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ach div { padding: 10px; border-radius: 10px; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08); font-size: 12px; color: var(--muted); }
.ach div b { display: block; font-size: 14px; color: #6b7a8f; }
.ach div.got { border-color: rgba(212, 175, 55, .55); background: rgba(212, 175, 55, .1); color: var(--ivory); }
.ach div.got b { color: var(--gold2); }
.horse-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.hcard { padding: 14px; }
.hcard .top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, .07); flex-wrap: wrap; }
.set-row label { flex: 1; min-width: 150px; font-weight: 700; }
.set-row input[type=range] { width: min(260px, 60vw); accent-color: var(--gold); }
.seg { flex-wrap: wrap; display: inline-flex; background: rgba(0, 0, 0, .3); border-radius: 10px; padding: 3px; border: 1px solid rgba(255, 255, 255, .1); }
.seg button { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font-weight: 700; color: var(--muted); min-height: 38px; }
.seg button.on { background: var(--gold); color: #2a1e04; }

/* ---------- モーダル・トースト ---------- */
#modal-root .backdrop { position: fixed; inset: 0; background: rgba(2, 6, 14, .7); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fadeIn .2s; backdrop-filter: blur(3px); }
.modal { width: min(520px, 100%); max-height: 88vh; overflow: auto; background: linear-gradient(180deg, #14294a, #0a172a); border: 1px solid rgba(212, 175, 55, .5); border-radius: 16px; padding: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.modal h3 { margin: 0 0 12px; color: var(--gold2); font-size: 20px; }
.modal .mbody { font-size: 14px; line-height: 1.7; }
.modal .mbtns { display: flex; gap: 10px; margin-top: 18px; }
.modal .mbtns .btn { flex: 1; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(212, 175, 55, .25); border-top-color: var(--gold); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pbar { width: 100%; height: 8px; background: rgba(255, 255, 255, .1); border-radius: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, #2a8c63, var(--gold2)); width: 0; transition: width .1s; }
#toast-root { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast { background: rgba(10, 23, 41, .96); border: 1px solid rgba(212, 175, 55, .55); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow); animation: toastIn .3s ease; text-align: center; }
.toast.err { border-color: var(--red); }
.toast.good { border-color: var(--ok); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } }
#fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
.bigwin { position: fixed; inset: 0; z-index: 65; display: grid; place-items: center; pointer-events: none; }
.bigwin div { font-family: var(--serif); font-weight: 900; font-size: clamp(40px, 11vw, 96px); color: var(--gold2); text-shadow: 0 0 40px rgba(240, 207, 106, .8), 0 4px 0 #6b4d00; animation: bigwin 2.6s ease forwards; text-align: center; }
.bigwin small { display: block; font-size: .32em; color: #fff; letter-spacing: .2em; }
@keyframes bigwin { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 15% { transform: scale(1.15) rotate(2deg); opacity: 1; } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
#boot-error { position: fixed; inset: 20px; background: #300; color: #fff; padding: 20px; border-radius: 12px; z-index: 99; white-space: pre-wrap; overflow: auto; }

/* ---------- レスポンシブ ---------- */
@media (max-width: 760px) {
  .screen { padding: 14px 10px calc(118px + var(--safe-b)); }
  .bet-types { grid-template-columns: repeat(4, 1fr); }
  .card-table .hide-sm { display: none; }
  .hname { font-size: 15px; }
  .grid2 { grid-template-columns: 1fr; }
  .rv-ranks { width: 170px; top: 92px; transform-origin: top left; }
  .rv-ranks-toggle { display: block; top: 92px; left: auto; right: 10px; }
  .rv-minimap { top: auto; bottom: 168px; right: 8px; width: 132px; height: 72px; }
  .rv-title { font-size: 12px; max-width: 60vw; }
  .rv-comment { bottom: 104px; font-size: 12px; white-space: normal; max-width: 94%; }
  .rv-btn { min-width: 52px; height: 50px; font-size: 16px; }
  .rv-controls { gap: 4px; }
  .rv-progress { bottom: 70px; }
}
@media (max-width: 760px) and (orientation: portrait) {
  .rv-ranks { width: 150px; }
  .rv-name { font-size: 11px; }
}
@media (max-height: 480px) and (orientation: landscape) {
  .rv-ranks { top: 52px; transform: scale(.85); transform-origin: top left; }
  .rv-comment { bottom: 92px; }
  .rv-progress { bottom: 64px; }
  .rv-btn { height: 44px; }
  .rv-minimap { top: 52px; }
}

/* スロー演出 */
.rv-slow { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); padding: 4px 14px; border-radius: 999px; background: rgba(224, 71, 76, .85); color: #fff; font-weight: 900; letter-spacing: .15em; font-size: 13px; opacity: 0; transition: opacity .25s; box-shadow: 0 0 18px rgba(224, 71, 76, .6); }
.rv-slow.show { opacity: 1; animation: slowPulse 1s ease-in-out infinite; }
@keyframes slowPulse { 50% { box-shadow: 0 0 4px rgba(224, 71, 76, .3); } }

.rv-rain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rv-photo-img { display: block; width: 100%; border-radius: 8px; border: 1px solid rgba(212, 175, 55, .5); margin-bottom: 8px; }
.rv-board-btns { display: flex; gap: 8px; margin-top: 12px; }
.rv-board-btns .btn { flex: 1; margin: 0; }
.rv-board { max-height: 86%; overflow: auto; }

/* 天候・馬場 */
.cond-line { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.wx, .going { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
.going.g1 { background: rgba(61,139,253,.18); } .going.g2 { background: rgba(61,139,253,.32); } .going.g3 { background: rgba(140,79,168,.4); }
.mud-tag { font-family: var(--serif); font-weight: 900; font-size: 15px; }
.mud-A { color: #5ee6a3; } .mud-B { color: #8fd3ff; } .mud-C { color: #b9c4d4; } .mud-D { color: #ff8a8a; }
.cond-mark { font-weight: 900; font-size: 16px; }
.cond-mark.c2 { color: #ff6b6b; } .cond-mark.c1 { color: #ffb36b; } .cond-mark.c0 { color: #b9c4d4; } .cond-mark.c-1 { color: #8fa3bd; } .cond-mark.c-2 { color: #6f7f95; }
/* 予想印 */
.mark-cell { width: 40px; padding: 4px !important; }
.mark-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px dashed rgba(255,255,255,.25); background: rgba(0,0,0,.2); font-size: 18px; font-weight: 900; color: var(--gold2); }
.mark-btn.on { border-style: solid; border-color: var(--gold); background: rgba(212,175,55,.15); }
/* パドック */
.pd-wrap { margin-bottom: 12px; }
.pd-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 56vh; border-radius: 14px; overflow: hidden; border: 1px solid rgba(212,175,55,.35); background: #0c1b30; }
.pd-canvas { width: 100%; height: 100%; display: block; }
.pd-hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; background: rgba(5,12,24,.7); padding: 4px 10px; border-radius: 8px; pointer-events: none; }
.pd-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.pd-item { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); min-height: 56px; }
.pd-item.on { border-color: var(--gold); background: rgba(212,175,55,.12); }
.pd-item .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { .pd-stage { aspect-ratio: 4 / 3; } }
/* 結果: 写真・グラフ */
.result-photo { width: 100%; border-radius: 10px; border: 1px solid rgba(212,175,55,.4); display: block; }
.pass-chart { width: 100%; min-width: 320px; height: auto; display: block; }
/* シーズン・称号 */
.season-card { background: linear-gradient(140deg, rgba(120,90,20,.55), rgba(12,28,48,.9)); border-color: rgba(240,207,106,.55); }
.title-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 900; font-family: var(--serif); color: var(--tc); border: 1px solid var(--tc); background: rgba(0,0,0,.3); letter-spacing: .05em; }
.title-badge.big { font-size: 24px; padding: 8px 20px; margin-top: 6px; box-shadow: 0 0 24px rgba(240,207,106,.25); }
.title-badge.sm { font-size: 11px; padding: 2px 8px; }
.hero .title-badge { margin: 8px auto 0; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.sched { display: flex; flex-direction: column; gap: 6px; }
.sched-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); }
.sched-row.done { opacity: .7; }
.sched-row.next { border-color: var(--gold); background: rgba(212,175,55,.1); }
.sch-no { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: rgba(0,0,0,.35); color: var(--gold2); flex: 0 0 auto; }

/* 重なり順: 馬番ラベルは掲示板・バナーより下 */
.rv-labels { z-index: 1; }
.rv-banner { z-index: 15; }
.rv-board { z-index: 20; }
.rv-slow { z-index: 16; }

.show-sm { display: none; }
.card-table td.pop { white-space: nowrap; }
@media (max-width: 760px) {
  .show-sm { display: block; margin-top: 4px; }
  .card-table td { padding: 8px 5px; }
  .mark-cell { width: 36px; }
  .mark-btn { width: 30px; height: 30px; font-size: 16px; }
}

/* デイリーミッション */
.missions { margin-top: 12px; padding: 12px 14px; }
.ms-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.ms-head b { color: var(--gold2); font-family: var(--serif); font-size: 16px; }
.ms-row { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.07); }
.ms-t { font-weight: 700; font-size: 14px; }
.ms-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); margin: 5px 0 3px; overflow: hidden; }
.ms-bar i { display: block; height: 100%; background: linear-gradient(90deg, #2a8c63, var(--gold2)); }
.ms-row.done .ms-t { color: var(--gold2); }
.ms-row.claimed { opacity: .55; }

/* 新聞の予想欄 */
.paper { background: #f3ecd9; color: #2a2118; border-radius: 6px; padding: 14px 14px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4), inset 0 0 60px rgba(120,90,40,.18); font-family: var(--serif); }
.paper-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; border-bottom: 3px double #2a2118; padding-bottom: 6px; }
.paper-title { font-size: 26px; font-weight: 900; letter-spacing: .12em; color: #8d1515; }
.paper-date { font-size: 13px; }
.paper-race { font-size: 14px; margin: 8px 0; padding: 4px 8px; background: #2a2118; color: #f3ecd9; display: inline-block; border-radius: 3px; }
.paper-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
.paper-table th { font-size: 11px; font-weight: 700; border-bottom: 1.5px solid #2a2118; padding: 4px 3px; text-align: center; white-space: nowrap; }
.paper-table td { border-bottom: 1px solid rgba(42,33,24,.25); padding: 5px 3px; text-align: center; }
.paper-table td.pt-name, .paper-table th.pt-name { text-align: left; font-weight: 700; font-family: var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.paper-table td.pm { font-size: 20px; font-weight: 900; color: #8d1515; width: 46px; }
.paper-table td.pt-total { position: relative; width: 70px; }
.pt-total i { position: absolute; left: 4px; top: 50%; height: 8px; margin-top: -4px; background: rgba(141,21,21,.35); border-radius: 2px; }
.pt-total span { position: relative; font-weight: 900; }
.pt-odds { font-family: var(--sans); font-variant-numeric: tabular-nums; font-weight: 700; }
.paper-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
.paper-col { border: 1.5px solid #2a2118; padding: 10px; border-top: 6px solid var(--rc); background: rgba(255,255,255,.35); }
.pc-head { display: flex; justify-content: space-between; align-items: baseline; }

  <script>
/* js/util.js */
/* util.js — 共通ユーティリティ（乱数・数学・フォーマット） */
(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};

  // 決定論的乱数 (mulberry32)。同じシードなら同じレース展開になる。
  function RNG(seed) {
    let a = (seed >>> 0) || 1;
    const next = function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.range = (lo, hi) => lo + (hi - lo) * next();
    next.int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    next.normal = () => {
      let u = 0, v = 0;
      while (u === 0) u = next();
      while (v === 0) v = next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    next.pick = (arr) => arr[Math.floor(next() * arr.length)];
    next.shuffle = (arr) => {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [a2[i], a2[j]] = [a2[j], a2[i]];
      }
      return a2;
    };
    return next;
  }

  function hashSeed(...parts) {
    let h = 2166136261 >>> 0;
    const s = parts.join('|');
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => t * t * (3 - 2 * t);
  function angleLerp(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  const fmtCoin = (n) => Math.round(n).toLocaleString('ja-JP');
  const fmtOdds = (o) => (Math.round(o * 10) / 10).toFixed(1);
  function fmtTime(sec) {
    if (!isFinite(sec)) return '--';
    const m = Math.floor(sec / 60);
    const s = sec - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }
  // 着差表記（秒差→馬身換算: 1馬身 ≒ 0.17秒）
  function marginText(dtSec) {
    if (dtSec < 0.0005) return '同着';
    if (dtSec < 0.02) return 'ハナ';
    if (dtSec < 0.045) return 'アタマ';
    if (dtSec < 0.08) return 'クビ';
    const l = dtSec / 0.17;
    if (l < 0.625) return '1/2';
    if (l < 0.875) return '3/4';
    if (l > 10) return '大差';
    const whole = Math.floor(l);
    const frac = l - whole;
    let f = '';
    if (frac >= 0.875) return (whole + 1) + '';
    if (frac >= 0.625) f = '3/4';
    else if (frac >= 0.375) f = '1/2';
    else if (frac >= 0.125) f = '1/4';
    return whole + (f ? ' ' + f : '');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  // 組合せ・順列
  function combinations(arr, k) {
    const out = [];
    const rec = (start, cur) => {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    };
    rec(0, []);
    return out;
  }
  function permutations(arr, k) {
    const out = [];
    const used = new Array(arr.length).fill(false);
    const rec = (cur) => {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = 0; i < arr.length; i++) {
        if (used[i]) continue;
        used[i] = true; cur.push(arr[i]); rec(cur); cur.pop(); used[i] = false;
      }
    };
    rec([]);
    return out;
  }

  RRG.util = { RNG, hashSeed, clamp, lerp, smooth, angleLerp, fmtCoin, fmtOdds, fmtTime, marginText, escapeHtml, todayKey, combinations, permutations };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* js/course.js */
/* course.js — 楕円（スタジアム型）コースの幾何。レース計算と描画の両方が使う。
 * s: 内ラチ基準の走行距離（ゴール板基準, 0〜lap）
 * lane: 内ラチからの外向き距離(m)
 * 座標: x,z が水平面, y が上。ホームストレッチは z=+R 側を +x 方向へ走る。
 */
(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};

  function Course(venue) {
    this.venue = venue;
    this.lap = venue.lap;
    this.R = venue.R;
    this.width = venue.width;
    this.Ls = (this.lap - 2 * Math.PI * this.R) / 2; // 直線長
    if (this.Ls < 50) throw new Error('コース寸法が不正です');
    this.curveLen = Math.PI * this.R;
    // ゴール板はホームストレッチ上（直線の72%地点）
    this.finishU = this.Ls * 0.72;
    this.homeStretch = this.finishU; // 最後の直線の長さ
  }

  // u: ホームストレッチ始点からの距離 → 位置・接線・外向き法線
  Course.prototype.atU = function (u, lane) {
    const L = this.lap, Ls = this.Ls, R = this.R, C = this.curveLen;
    u = ((u % L) + L) % L;
    lane = lane || 0;
    let x, z, tx, tz, nx, nz, curve = false;
    if (u < Ls) { // ホームストレッチ (+x)
      x = -Ls / 2 + u; z = R; tx = 1; tz = 0; nx = 0; nz = 1;
    } else if (u < Ls + C) { // 第1-2コーナー
      const phi = (u - Ls) / R;
      const s = Math.sin(phi), c = Math.cos(phi);
      x = Ls / 2 + R * s; z = R * c; tx = c; tz = -s; nx = s; nz = c; curve = true;
    } else if (u < 2 * Ls + C) { // バックストレッチ (-x)
      x = Ls / 2 - (u - Ls - C); z = -R; tx = -1; tz = 0; nx = 0; nz = -1;
    } else { // 第3-4コーナー
      const phi = (u - 2 * Ls - C) / R;
      const s = Math.sin(phi), c = Math.cos(phi);
      x = -Ls / 2 - R * s; z = -R * c; tx = -c; tz = s; nx = -s; nz = -c; curve = true;
    }
    return { x: x + nx * lane, z: z + nz * lane, tx, tz, nx, nz, curve };
  };

  // レース距離 s（スタート=ゴール板）→ u
  Course.prototype.sToU = function (s) { return this.finishU + s; };
  Course.prototype.at = function (s, lane) { return this.atU(this.sToU(s), lane); };

  Course.prototype.isCurve = function (s) {
    const L = this.lap;
    const u = ((this.sToU(s) % L) + L) % L;
    return (u >= this.Ls && u < this.Ls + this.curveLen) || u >= 2 * this.Ls + this.curveLen;
  };

  // 区間名（実況用）
  Course.prototype.sectionName = function (s) {
    const L = this.lap;
    const u = ((this.sToU(s) % L) + L) % L;
    const Ls = this.Ls, C = this.curveLen;
    if (u < Ls) return s > L * 0.5 ? '最後の直線' : 'スタート直後';
    if (u < Ls + C) return u < Ls + C / 2 ? '1コーナー' : '2コーナー';
    if (u < 2 * Ls + C) return '向こう正面';
    return u < 2 * Ls + C * 1.5 ? '3コーナー' : '4コーナー';
  };

  RRG.Course = Course;

/* js/raceSim.js */
/* raceSim.js — レースシミュレーション（描画から完全に独立）
 * 能力・脚質・スタミナ・加速・位置取り（進路・ブロック・スリップストリーム）・
 * コーナー・末脚を組み合わせた確率的レース展開を、固定タイムステップで計算する。
 * 同じ seed なら必ず同じ展開・着順になる（決定論的）。

(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};
  const U = RRG.util;

  const STYLE_PARAM = {
    // early: 序盤の巡航比率, mid: 中盤, spurtAt: スパート開始(レース進行率), spurtBonus: 末脚補正, laneBias: 好む位置
    '逃げ': { early: 0.962, mid: 0.946, spurtAt: 0.74, spurtBonus: -0.008, outBias: 0.0 },
    '先行': { early: 0.952, mid: 0.945, spurtAt: 0.71, spurtBonus: 0.004, outBias: 0.4 },
    '差し': { early: 0.943, mid: 0.944, spurtAt: 0.68, spurtBonus: 0.024, outBias: 0.8 },
    '追込': { early: 0.936, mid: 0.943, spurtAt: 0.655, spurtBonus: 0.034, outBias: 1.3 },
  };

  const DT = 0.05;          // 計算刻み（秒）
  const HORSE_LEN = 2.4;    // 1馬身(m)
  const SIDE_GAP = 1.25;    // 横並び時の最小間隔(m)

  /**
   * @param {object} opt { course, runners:[{num, horse:{spd,sta,acc,cor,kick,style}}], seed, record }
   * @returns {object} { finishOrder:[num...], finishTimes:{num:t}, frames?, dt, duration }
   */
  function simulate(opt) {
    const course = opt.course;
    const D = course.lap;              // 1周
    const rng = U.RNG(opt.seed);
    const n = opt.runners.length;
    const width = course.width;
    const laneMin = 0.9, laneMax = width - 1.2;
    const R = course.R;

    // 馬場状態（0=良 … 3=不良）: 全体が時計を要し、道悪適性で差が出る。スタミナも余計に使う
    const going = opt.going || 0;
    const MUD = (RRG.data && RRG.data.MUD_SCORE) || { A: 1, B: 0.35, C: -0.4, D: -1 };
    // 馬の状態を初期化
    const H = opt.runners.map((r, i) => {
      const h = r.horse;
      const sp = STYLE_PARAM[h.style] || STYLE_PARAM['先行'];
      // 当日の調子 = パドック気配(cond: -2〜+2) + 小さな揺らぎ
      const cond = r.cond || 0;
      const form = 1 + cond * 0.0033 + U.clamp(rng.normal() * 0.0065, -0.018, 0.018);
      const mudK = 1 - going * 0.006 + going * 0.003 * (MUD[h.mud] || 0);
      const top = (17.1 + h.spd * 0.006) * form * mudK;
      let delay = U.clamp(0.12 + rng.normal() * 0.07, 0, 0.35);
      if (rng() < 0.035) delay += 0.45 + rng() * 0.35; // 出遅れ
      const spacing = Math.min(1.45, (width - 3.5) / Math.max(1, n - 1));
      return {
        num: r.num, h, sp, top,
        accel: 1.9 + h.acc * 0.028,
        corner: 0.962 + h.cor * 0.00032,
        kick: 1.0 + (h.kick - 75) * 0.0007 + sp.spurtBonus,
        staF: (0.83 + h.sta * 0.0036) / (1 + going * 0.035),
        spurtAt: sp.spurtAt - (h.kick - 75) * 0.0006 + rng.normal() * 0.015,
        s: 0, prevS: 0, lane: laneMin + 0.4 + i * spacing, laneT: laneMin + 0.4 + i * spacing,
        v: 0, E: 1, delay, noise: 0, noiseT: 0, finished: false, finishT: Infinity,
        blocked: 0, blockRun: 0, draft: 0,
      };
    });

    const expectedT = D / 16.7;
    const frames = opt.record ? H.map(() => []) : null;
    let t = 0;
    let finishedCount = 0;
    let allDoneT = Infinity;
    const maxT = expectedT * 2.2 + 20;
    const order = H.slice();

    while (t < maxT) {
      // 前から順に並べる（位置取り判定用）
      order.sort((a, b) => b.s - a.s);

      for (let oi = 0; oi < n; oi++) {
        const a = order[oi];
        const f = a.s / D;
        // 目標速度
        let ratio;
        if (a.finished) {
          ratio = Math.max(0.42, 0.95 - (t - a.finishT) * 0.08);

        else if (f < a.spurtAt) ratio = U.lerp(a.sp.early, a.sp.mid, U.clamp((f - 0.18) / 0.2, 0, 1));
        else ratio = a.kick * U.lerp(0.985, 1.0, U.clamp((f - a.spurtAt) / 0.08, 0, 1));

        // 終盤の競り合い: 後続は差に応じて追い上げ、大きく抜け出した先頭は少し手綱を緩める
        if (!a.finished && f >= a.spurtAt) {
          const gapLead = order[0].s - a.s;
          ratio *= 1 + U.clamp(gapLead / (HORSE_LEN * 45), 0, 0.022);
          if (oi === 0 && n > 1 && f > 0.86 && a.s - order[1].s > HORSE_LEN * 2.5) ratio *= 0.986;
        }
        // 揺らぎ（展開のばらつき）
        a.noiseT -= DT;
        if (a.noiseT <= 0) { a.noise = rng.normal() * 0.0065; a.noiseT = 1.2 + rng() * 1.8; }
        ratio *= 1 + a.noise;

        // コーナー（外を回るほど距離ロス、適性で速度上限）
        const onCurve = course.isCurve(a.s);
        if (onCurve && !a.finished) ratio = Math.min(ratio, a.corner * (a.sp.early + 0.03));

        // スタミナ切れ

        let target = a.top * ratio;
        if (t < a.delay) target = 0;

        // 前方の馬にふさがれているか
        let blocker = null;
        for (let oj = oi - 1; oj >= 0; oj--) {
          const b = order[oj];
          const ds = b.s - a.s;
          if (ds > HORSE_LEN * 1.4) break;
          if (Math.abs(b.lane - a.lane) < SIDE_GAP && ds > 0) { blocker = b; break; }

          if (target > blocker.v) {

            const spurting = f >= a.spurtAt || a.blockRun > 2.5;
            const cands = a.blockRun > 4
              ? [a.lane + SIDE_GAP + 0.2, a.lane + 2 * SIDE_GAP + 0.3, a.lane + 3 * SIDE_GAP + 0.4, a.lane - SIDE_GAP - 0.2]
              : spurting
              ? [a.lane + SIDE_GAP + 0.2, a.lane + 2 * SIDE_GAP + 0.3, a.lane - SIDE_GAP - 0.2]
              : [a.lane + SIDE_GAP + 0.2, a.lane - SIDE_GAP - 0.2];
            let found = -1;
            for (let ci = 0; ci < cands.length && found < 0; ci++) {
              const ln = cands[ci];
              if (ln < laneMin || ln > laneMax) continue;
              let ok = true;
              for (let k = 0; k < n; k++) {
                const c = order[k];
                if (c === a) continue;
                const dsk = c.s - a.s;
                if (dsk > -HORSE_LEN * 1.1 && dsk < HORSE_LEN * 1.6 && Math.abs(c.lane - ln) < SIDE_GAP) { ok = false; break; }
              }
              if (ok) found = ln;
            }
            if (found >= 0) { a.laneT = found; a.blockRun = 0; }
            else { a.blocked += DT; a.blockRun += DT; }
            // 横に抜け出すまでは前の馬を追い越せない（すり抜け防止）
            if (blocker.s - a.s < HORSE_LEN * 1.15) target = Math.min(target, blocker.v + (found >= 0 ? 0.15 : 0.03));
          }
        } else if (!a.finished) {
          // 進路が開いていれば内へ（脚質ごとの好位置へ）
          const pref = laneMin + a.sp.outBias * (f > 0.15 && f < a.spurtAt ? 1 : 0.4);
          if (a.laneT > pref + 0.3) {
            const cand = a.laneT - 0.6;
            let ok = true;
            for (let k = 0; k < n; k++) {
              const c = order[k];
              if (c === a) continue;
              if (Math.abs(c.s - a.s) < HORSE_LEN * 1.5 && c.lane < a.lane && c.lane > cand - SIDE_GAP) { ok = false; break; }

          a.v = Math.min(target, a.v + a.accel * room * DT);
        } else {
          a.v = Math.max(target, a.v - (a.finished ? 0.9 : 1.6) * DT);
        }

        // スタミナ消費（速度の高次関数、スリップストリームで軽減）

      }

      // 横移動と横の接触回避
      for (let i = 0; i < n; i++) {
        const a = H[i];
        a.laneT = U.clamp(a.laneT, laneMin, laneMax);
        const dl = a.laneT - a.lane;
        const maxLat = (t < 6 ? 0.5 : 0.95) * DT;
        a.lane += U.clamp(dl, -maxLat, maxLat);
      }
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = H[i], b = H[j];
          if (Math.abs(a.s - b.s) < HORSE_LEN * 1.05) {
            const d = b.lane - a.lane;
            if (Math.abs(d) < SIDE_GAP) {
              const push = (SIDE_GAP - Math.abs(d)) * 0.5 * (d >= 0 ? 1 : -1);
              a.lane = U.clamp(a.lane - push * 0.5, laneMin, laneMax);
              b.lane = U.clamp(b.lane + push * 0.5, laneMin, laneMax);
            }
          }
        }
      }

      // 前進（コーナーでは外ほど内ラチ換算の進みが遅い）
      for (let i = 0; i < n; i++) {
        const a = H[i];
        a.prevS = a.s;
        const k = course.isCurve(a.s) ? R / (R + a.lane * 0.45) : 1; // 外を回る距離ロス（位置取りの影響）
        a.s += a.v * DT * k;
        if (!a.finished && a.s >= D) {
          // ゴール板通過時刻をステップ内で補間して記録
          const frac = (D - a.prevS) / (a.s - a.prevS);
          a.finishT = t + frac * DT;
          a.finished = true;
          a.Efin = a.E;
          finishedCount++;
          if (finishedCount === n) allDoneT = t;
        }
      }

      if (frames) {
        for (let i = 0; i < n; i++) frames[i].push(H[i].s, H[i].lane, H[i].v);
      }
      t += DT;
      if (t > allDoneT + (opt.tail != null ? opt.tail : 7)) break;

    // 未完走（理論上発生しないが安全策）
    H.forEach((a) => { if (!a.finished) { a.finishT = maxT + (D - a.s); a.finished = true; } });

    const sorted = H.slice().sort((a, b) => (a.finishT - b.finishT) || (a.num - b.num));
    const result = {
      finishOrder: sorted.map((a) => a.num),
      finishTimes: {},
      dt: DT,
      duration: t,
      lap: D,
    };
    sorted.forEach((a) => { result.finishTimes[a.num] = a.finishT; });
    if (opt.debug) result.debug = H.map((a) => ({ num: a.num, E: a.Efin, blocked: a.blocked, lane: a.lane }));

      H.forEach((a, i) => { result.frames[a.num] = new Float32Array(frames[i]); });

    }

  }

  <script>
/* js/odds.js */
/* odds.js — オッズ生成（ゲーム内の仮想・固定オッズ）
 * 1) 実際のレースエンジンを別シードで多数回シミュレートし、各馬の勝率・3着内率を推定
 * 2) 勝率から Harville 型モデル（下位着順の補正つき）で 2着・3着の組合せ確率を算出
 * 3) オッズ = 返還率 ÷ 的中確率（小数第1位で切り捨て、下限あり）
 */
(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};
  const U = RRG.util;

  // 返還率（実際の競馬の控除率を参考にした値）
  const RETURN_RATE = { tansho: 0.80, fukusho: 0.80, umaren: 0.775, wide: 0.775, umatan: 0.75, sanrenpuku: 0.75, sanrentan: 0.725 };
  const MIN_ODDS = 1.1;
  const MAX_ODDS = 99999.9;

  function placeCount(fieldSize) {
    if (fieldSize >= 8) return 3;
    if (fieldSize >= 5) return 2;
    return 0; // 4頭以下は複勝発売なし
  }

  function toOdds(type, p) {
    if (!(p > 0)) return MAX_ODDS;
    const o = Math.floor((RETURN_RATE[type] / p) * 10) / 10;
    return U.clamp(o, MIN_ODDS, MAX_ODDS);
  }

  function keyOf(nums, ordered) {
    const a = ordered ? nums.slice() : nums.slice().sort((x, y) => x - y);
    return a.join('-');
  }

  /**
   * モンテカルロ推定（非同期・分割実行でUIを固めない）
   * @param {object} race { course, runners, seed }
   * @param {number} runs 試行回数
   * @param {function} onProgress (0..1)
   * @returns Promise<stats>
   */
  function estimate(race, runs, onProgress) {
    const n = race.runners.length;
    const win = new Array(n + 1).fill(0);
    const top3 = new Array(n + 1).fill(0);
    let done = 0;
    return new Promise((resolve) => {
      const step = () => {
        const t0 = Date.now();
        while (done < runs && Date.now() - t0 < 30) {
          const r = RRG.raceSim.simulate({
            course: race.course, runners: race.runners, going: race.going,
            seed: U.hashSeed(race.seed, 'odds', done), tail: 0,
          });
          win[r.finishOrder[0]]++;
          for (let k = 0; k < 3; k++) top3[r.finishOrder[k]]++;
          done++;
        }
        if (onProgress) onProgress(done / runs);
        if (done < runs) setTimeout(step, 0);
        else resolve({ win, top3, runs });
      };
      step();
    });
  }

  function estimateSync(race, runs) {
    const n = race.runners.length;
    const win = new Array(n + 1).fill(0);
    const top3 = new Array(n + 1).fill(0);
    for (let i = 0; i < runs; i++) {
      const r = RRG.raceSim.simulate({ course: race.course, runners: race.runners, going: race.going, seed: U.hashSeed(race.seed, 'odds', i), tail: 0 });
      win[r.finishOrder[0]]++;
      for (let k = 0; k < 3; k++) top3[r.finishOrder[k]]++;
    }
    return { win, top3, runs };
  }

  /** 推定結果から全券種のオッズ表を作る */
  function buildTable(nums, stats) {
    const n = nums.length;
    const N = stats.runs;
    // 勝率（ベイズ平滑化）
    const pw = {};
    let sum = 0;
    nums.forEach((k) => { pw[k] = (stats.win[k] + 0.35) / (N + 0.35 * n); sum += pw[k]; });
    nums.forEach((k) => { pw[k] /= sum; });

    // 下位着順は確率差が縮む補正（Lo & Bacon-Shone 近似）
    const norm = (lam) => {
      const o = {}; let s = 0;
      nums.forEach((k) => { o[k] = Math.pow(pw[k], lam); s += o[k]; });
      nums.forEach((k) => { o[k] /= s; });
      return o;
    };
    const q = norm(0.81), r = norm(0.65);

    const tri = {}; // 3連単確率
    const exa = {}; // 馬単確率
    const inTop3 = {};
    nums.forEach((k) => { inTop3[k] = 0; });
    nums.forEach((i) => {
      nums.forEach((j) => {
        if (j === i) return;
        const pij = pw[i] * q[j] / (1 - q[i]);
        exa[i + '-' + j] = pij;
        nums.forEach((k) => {
          if (k === i || k === j) return;
          const p = pij * r[k] / (1 - r[i] - r[j]);
          tri[i + '-' + j + '-' + k] = p;
          inTop3[i] += p; inTop3[j] += p; inTop3[k] += p;
        });
      });
    });

    const table = { tansho: {}, fukusho: {}, umaren: {}, umatan: {}, wide: {}, sanrenpuku: {}, sanrentan: {}, winProb: pw };
    const pc = placeCount(n);
    nums.forEach((k) => {
      table.tansho[k] = toOdds('tansho', pw[k]);
      // 複勝: MC の3着内率とモデル値の平均（2着までの場合はモデル寄り）
      const mc = (stats.top3[k] + 0.5) / (N + 1.5);
      let pp = pc === 3 ? (mc + inTop3[k]) / 2 : Math.min(0.97, pw[k] + nums.reduce((a, i) => a + (i !== k ? exa[i + '-' + k] : 0), 0));
      table.fukusho[k] = toOdds('fukusho', Math.min(0.97, pp));
    });
    const pairs = U.combinations(nums, 2);
    pairs.forEach(([a, b]) => {
      table.umaren[keyOf([a, b])] = toOdds('umaren', exa[a + '-' + b] + exa[b + '-' + a]);
      let w = 0;
      nums.forEach((k) => {
        if (k === a || k === b) return;
        U.permutations([a, b, k], 3).forEach((p) => { w += tri[p.join('-')]; });

      table.wide[keyOf([a, b])] = toOdds('wide', w);
    });
    U.permutations(nums, 2).forEach(([a, b]) => { table.umatan[a + '-' + b] = toOdds('umatan', exa[a + '-' + b]); });

      let p = 0;
      U.permutations(c, 3).forEach((pp) => { p += tri[pp.join('-')]; });
      table.sanrenpuku[keyOf(c)] = toOdds('sanrenpuku', p);
    });
    U.permutations(nums, 3).forEach((c) => { table.sanrentan[c.join('-')] = toOdds('sanrentan', tri[c.join('-')]); });

    const pop = nums.slice().sort((a, b) => (table.tansho[a] - table.tansho[b]) || (pw[b] - pw[a]) || (a - b));

    pop.forEach((k, i) => { table.popularity[k] = i + 1; });

/* betting.js — 馬券の組合せ生成・購入検証・的中判定・払戻計算（UI・描画から独立） */
(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};
  const U = RRG.util;

  const TYPE = {};
  RRG.data.BET_TYPES.forEach((t) => { TYPE[t.id] = t; });

  const MIN_STAKE = 100;
  const MAX_STAKE = 1000000;
  const MAX_COMBOS = 2000;

  /** 選択内容から買い目（組合せ）一覧を作る */
  function buildCombos(type, mode, sel) {
    const t = TYPE[type];
    if (!t) return [];
    const k = t.pick;
    let list = [];
    if (mode === 'normal') {
      if (!Array.isArray(sel) || sel.length !== k) return [];
      list = [sel.slice()];
    } else if (mode === 'box') {
      if (!Array.isArray(sel) || sel.length < k) return [];
      list = k === 1 ? sel.map((x) => [x]) : (t.ordered ? U.permutations(sel, k) : U.combinations(sel, k));
    } else if (mode === 'formation') {
      if (!Array.isArray(sel) || sel.length !== k || sel.some((c) => !c || !c.length)) return [];
      const rec = (i, cur) => {
        if (i === k) { list.push(cur.slice()); return; }
        for (const x of sel[i]) { if (cur.indexOf(x) < 0) { cur.push(x); rec(i + 1, cur); cur.pop(); } }
      };
      rec(0, []);
    } else return [];
    // 重複除去（順不同の券種はソートしてキー化）
    const seen = new Set();
    const out = [];
    for (const c of list) {
      if (new Set(c).size !== c.length) continue;
      const nums = t.ordered ? c : c.slice().sort((a, b) => a - b);
      const key = nums.join('-');
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(nums);
    }
    return out;
  }

  function payoutOf(stakePer, odds) {
    // 払戻額 = 購入金額 × オッズ。整数演算で誤差を出さない（100円単位 × 0.1倍単位 = 10の倍数）
    return (stakePer / 100) * Math.round(odds * 10) * 10;
  }

  /**
   * 馬券を作成（残高の検証まで。残高の増減は game 側で一括して行う）
   * @returns {ok:true,ticket} | {ok:false,error}
   */
  function createTicket(race, type, mode, sel, stakePer, balance, idGen) {
    if (!race || race.status !== 'open') return { ok: false, error: '発売は締め切られています' };
    if (!TYPE[type]) return { ok: false, error: '馬券の種類が不正です' };
    stakePer = Number(stakePer);
    if (!Number.isInteger(stakePer) || stakePer < MIN_STAKE || stakePer % 100 !== 0) return { ok: false, error: '賭け金は100コイン単位で指定してください' };
    if (stakePer > MAX_STAKE) return { ok: false, error: '1点あたりの上限は1,000,000コインです' };
    const valid = new Set(race.runners.map((r) => r.num));
    const flat = mode === 'formation' ? [].concat(...(sel || [])) : (sel || []);
    if (flat.some((x) => !valid.has(x))) return { ok: false, error: '存在しない馬番が含まれています' };
    if (type === 'fukusho' && RRG.odds.placeCount(race.runners.length) === 0) return { ok: false, error: 'この頭数では複勝は発売されません' };
    const combos = buildCombos(type, mode, sel);
    if (!combos.length) return { ok: false, error: '馬番の選択が足りません' };
    if (combos.length > MAX_COMBOS) return { ok: false, error: '購入点数が多すぎます（最大' + MAX_COMBOS + '点）' };
    const total = stakePer * combos.length;
    if (total > balance) return { ok: false, error: 'コインが不足しています' };
    const ticket = {
      id: idGen ? idGen() : 't' + Date.now() + Math.floor(Math.random() * 1e6),
      raceId: race.id,
      type, mode,
      sel: JSON.parse(JSON.stringify(sel)),
      stakePer,
      // 購入時のオッズを確定して保存（払戻はこの値で計算）
      combos: combos.map((nums) => ({ nums, odds: RRG.odds.lookup(race.odds, type, nums) })),
      total,
    };
    if (ticket.combos.some((c) => !(c.odds > 0))) return { ok: false, error: 'オッズが取得できません' };
    return { ok: true, ticket };
  }

  /** 的中判定 order: 着順に並んだ馬番 */
  function isHit(type, nums, order, fieldSize) {
    const top = (k) => order.slice(0, k);
    const sameSet = (a, b) => a.length === b.length && a.every((x) => b.indexOf(x) >= 0);
    switch (type) {
      case 'tansho': return nums[0] === order[0];
      case 'fukusho': {
        const pc = RRG.odds.placeCount(fieldSize);
        return pc > 0 && top(pc).indexOf(nums[0]) >= 0;
      }
      case 'umaren': return sameSet(nums, top(2));
      case 'umatan': return nums[0] === order[0] && nums[1] === order[1];
      case 'wide': return top(3).indexOf(nums[0]) >= 0 && top(3).indexOf(nums[1]) >= 0;
      case 'sanrenpuku': return sameSet(nums, top(3));
      case 'sanrentan': return nums[0] === order[0] && nums[1] === order[1] && nums[2] === order[2];
      default: return false;
    }
  }

  /** 全馬券を精算（純粋関数：残高は変更しない） */
  function settle(tickets, order, fieldSize) {
    let totalBet = 0, totalPayout = 0;
    const results = tickets.map((t) => {
      let payout = 0;
      const hits = [];
      t.combos.forEach((c) => {
        if (isHit(t.type, c.nums, order, fieldSize)) {
          const p = payoutOf(t.stakePer, c.odds);
          hits.push({ nums: c.nums, odds: c.odds, payout: p });
          payout += p;
        }
      });
      totalBet += t.total;
      totalPayout += payout;
      return { ticketId: t.id, type: t.type, hit: hits.length > 0, hits, payout, total: t.total };
    });
    return { results, totalBet, totalPayout, profit: totalPayout - totalBet };
  }

  /** 各券種の的中組合せ（公式払戻表示用） */
  function winningCombos(order, fieldSize) {
    const pc = RRG.odds.placeCount(fieldSize);
    const t3 = order.slice(0, 3);
    return {
      tansho: [[order[0]]],
      fukusho: order.slice(0, pc).map((x) => [x]),
      umaren: [order.slice(0, 2).sort((a, b) => a - b)],
      umatan: [order.slice(0, 2)],
      wide: U.combinations(t3, 2).map((c) => c.sort((a, b) => a - b)),
      sanrenpuku: [t3.slice().sort((a, b) => a - b)],
      sanrentan: [t3],
    };
  }

  function describeTicket(t) {
    const tp = TYPE[t.type];
    const sep = tp.ordered ? '→' : '-';
    let sel;
    if (t.mode === 'normal') sel = t.sel.join(sep);
    else if (t.mode === 'box') sel = (tp.pick === 1 ? '' : 'BOX ') + t.sel.join(',');
    else sel = t.sel.map((c) => c.join(',')).join(' / ');
    return { name: tp.name, modeName: t.mode === 'box' && tp.pick === 1 ? 'まとめ買い' : { normal: '通常', box: 'ボックス', formation: 'フォーメーション' }[t.mode], sel, sep };
  }

  RRG.betting = { buildCombos, createTicket, isHit, settle, payoutOf, winningCombos, describeTicket, TYPE, MIN_STAKE, MAX_COMBOS };
})(typeof window !== 'undefined' ? window : globalThis);

  const RRG = G.RRG = G.RRG || {};

  const KEY = 'rrg_save_v1';
  const BACKUP_KEY = 'rrg_save_v1_backup';
  const VERSION = 1;
  const INITIAL_COINS = 10000;

    RRG.data.BET_TYPES.forEach((t) => { byType[t.id] = { tickets: 0, hits: 0, bet: 0, payout: 0 }; });
    return {
      races: 0, betRaces: 0, totalBet: 0, totalPayout: 0,
      maxPayout: 0, maxPayoutDesc: '', maxStreak: 0, curStreak: 0, hitRaces: 0,
      byType, recent: [],
    };
  }

  function defaultSave() {
    return {
      version: VERSION,
      coins: INITIAL_COINS,
      stats: defaultStats(),
      settings: {
        master: 0.8, bgm: 0.5, se: 0.8, mute: false,
        quality: 'high', defaultSpeed: 1, camera: 'auto', labels: true, slowmo: true, slowCam: 'auto', voice: true, voiceRate: 1.1,
      },
      unlocked: ['suirei'],
      achievements: {},
      horseRecords: {},
      raceCounter: 0,
      lastBonusDay: '',
      lastLoginDay: '',
      currentRace: null,
      season: null,
      seasonHistory: [],
      pressStats: {},
      daily: null,
    };
  }

  // 欠けた項目を既定値で補う（古いデータ・壊れたデータへの耐性）
  function merge(def, src) {
    if (src === null || typeof src !== 'object' || Array.isArray(def) !== Array.isArray(src)) return def;
    if (Array.isArray(def)) return src;
    const out = {};
    for (const k in def) {
      if (!(k in src)) out[k] = def[k];
      else if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k])) out[k] = merge(def[k], src[k]);
      else if (typeof def[k] === 'number') out[k] = Number.isFinite(src[k]) ? src[k] : def[k];
      else out[k] = src[k];
    }
    for (const k in src) if (!(k in out)) out[k] = src[k];
    return out;
  }

  function storageAvailable() {
    try {
      const s = G.localStorage;
      const t = '__rrg_test__';
      s.setItem(t, '1'); s.removeItem(t);
      return true;
    } catch (e) { return false; }
  }

  const Storage = {
    available: false,
    lastError: null,
    load() {
      this.available = storageAvailable();
      if (!this.available) { this.lastError = 'ブラウザの保存機能が使えないため、今回のプレイは保存されません。'; return defaultSave(); }
      let raw = null;
      try { raw = G.localStorage.getItem(KEY); } catch (e) { raw = null; }

    save(data) {
      if (!this.available) return false;
      try {
        G.localStorage.setItem(KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        this.lastError = '保存に失敗しました: ' + e.message;
        return false;

    reset() {
      try { G.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }

    },

  };

  RRG.storage = Storage;
