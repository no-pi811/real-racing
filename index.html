    this.stadium && (this.stadium.gateVisible = false);
    this.paused = false;
    this.updateButtons();
  };
  RaceView.prototype.lastFinishT = function () { return Math.max(...this.runners.map((r) => r.finishT)); };

  RaceView.prototype.banner = function (text, kind, dur) {
    this.bannerEl.textContent = text;
    this.bannerEl.className = 'rv-banner show ' + (kind || '');
    clearTimeout(this._bt);
    if (dur) this._bt = setTimeout(() => { this.bannerEl.className = 'rv-banner'; }, dur * 1000);
  };
  // 実況テロップ＋読み上げ。prio: 2=重要（必ず読む）、1=通常、0=余裕があれば、-1=読まない
  RaceView.prototype.comment = function (text, prio) {
    this.commentEl.textContent = text;
    this.commentEl.classList.remove('flash'); void this.commentEl.offsetWidth; this.commentEl.classList.add('flash');
    if (prio == null) prio = 1;
    if (prio < 0 || this.paused) return;
    // 早送り中は重要な実況だけ読む
    if (!this.replay && this.speed > 1 && prio < 2) return;
    RRG.audio.speak(text.replace(/[　\s]+/g, ' '), prio);
  };
  // 馬名の呼び方（実況用）
  RaceView.prototype.call = function (r) { return r.num + '番 ' + r.name; };

  // ---------- メインフレーム ----------
  RaceView.prototype.frame = function (dtReal) {
    // スロー中は観戦速度（1×/2×/4×）に関係なく、一定のスロー速度で再生する
    const rate = this.replay ? this.replay.passes[this.replay.i].rate : this.speed + (this.slowRate - this.speed) * this.slowW;
    const dtGame = this.paused ? 0 : dtReal * rate;
    if (this.state === 'intro') {
      this.introT += dtGame;
      if (this.introT >= this.introDur - 1.2 && !this._ready) { this._ready = true; this.banner('ゲートイン完了', 'info', 1.2); this.comment('各馬ゲートイン完了。', 1); }
      if (this.introT >= this.introDur) {
        this.state = 'race';
        this._ready = false;
        this.banner('スタート！', 'start', 1.4);
        RRG.audio.gate();
        RRG.audio.setCrowd(0.45);
        this.comment('スタートしました！', 2);
        this.talk = {};
      }
    } else if (this.state === 'race' || this.state === 'replay') {
      this.t += dtGame;
    }
    if (this.state === 'replay') this.updateReplay();
    // ゲートの扉
    if (this.stadium) {
      if (this.state === 'race') this.stadium.setGateOpen(U.clamp(this.t / 0.35, 0, 1));
      if (this.t > 7) this.stadium.gateVisible = false;
    }

    const snap = this.snapshot();
    this.updateRaceLogic(snap, dtReal);
    if (this.mode === 'gl') this.renderGL(snap, dtGame, dtReal);
    else this.render2D(snap, dtGame, dtReal);
    this.updateHUD(snap, dtReal);
    this.drawRain(dtReal);
  };

  // ---------- 雨（画面に重ねる2Dの雨粒） ----------
  RaceView.prototype.drawRain = function (dt) {
    const c = this.rainCv, amount = this.weather ? this.weather.rain : 0;
    if (!amount) { if (this._rainOn) { c.getContext('2d').clearRect(0, 0, c.width, c.height); this._rainOn = false; } return; }
    this._rainOn = true;
    const W = c.clientWidth, H = c.clientHeight;
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext('2d');
    const n = amount === 1 ? 110 : 260;
    if (!this.drops || this.drops.length !== n) {
      this.drops = [];
      for (let i = 0; i < n; i++) this.drops.push({ x: Math.random() * W, y: Math.random() * H, v: 0.7 + Math.random() * 0.6, l: 8 + Math.random() * 14 });
    }
    g.clearRect(0, 0, W, H);
    if (amount > 1) { g.fillStyle = 'rgba(40,50,70,0.10)'; g.fillRect(0, 0, W, H); }
    g.strokeStyle = 'rgba(210,225,245,' + (amount === 1 ? 0.35 : 0.5) + ')';
    g.lineWidth = 1.2;
    g.beginPath();
    const sp = (this.paused ? 0 : 1) * dt * H * 1.6 * (this.replay ? this.replay.passes[this.replay.i].rate : 1);
    this.drops.forEach((d) => {
      d.y += sp * d.v; d.x -= sp * d.v * 0.18;
      if (d.y > H + 20) { d.y = -20; d.x = Math.random() * W * 1.2; }
      if (d.x < -20) d.x += W + 20;
      g.moveTo(d.x, d.y); g.lineTo(d.x - d.l * 0.18, d.y + d.l);
    });
    g.stroke();
  };

  // ---------- リプレイ（ゴール前を複数のアングルで再生） ----------
  RaceView.prototype.timeLeaderAt = function (S) {
    let best = Infinity;
    const dt = this.sim.dt;
    this.runners.forEach((r) => {
      const f = r.frames;
      for (let i = 0; i < this.sim.steps; i++) if (f[i * 3] >= S) { best = Math.min(best, (i + 1) * dt); break; }
    });
    return best === Infinity ? 0 : best;
  };
  RaceView.prototype.startReplay = function () {
    RRG.audio.stopSpeak();
    if (this.opts.onReplay) this.opts.onReplay();
    const D = this.D, fo = this.sim.finishOrder, ft = this.sim.finishTimes;
    const third = ft[fo[Math.min(2, fo.length - 1)]];
    const passes = [
      { name: '最後の直線', cam: 'stretch', from: this.timeLeaderAt(D - 90), to: third + 0.8, rate: 1 },
      { name: 'ゴール真上・スロー', cam: 'goaltop', from: this.timeLeaderAt(D - 28), to: ft[fo[0]] + 1.4, rate: 0.35 },
      { name: 'ゴール真横・スーパースロー', cam: 'goalside', from: this.timeLeaderAt(D - 12), to: third + 0.5, rate: 0.2 },
    ];
    if (this.myNums.size) {
      const fav = this.favNum;
      passes.push({ name: '応援馬 ' + fav + '番', cam: 'myhorse', from: Math.max(0, ft[fav] - 6), to: ft[fav] + 1, rate: 0.6 });
    }
    this.replay = { passes, i: 0 };
    this.state = 'replay';
    this.introT = this.introDur;
    if (this.stadium) this.stadium.gateVisible = false;
    this.slowActive = false; this.slowW = 0;
    this.slowEl.classList.add('show');
    this.boardEl.className = 'rv-board';
    this.paused = false;
    this.updateButtons();
    this.beginPass();
  };
  RaceView.prototype.beginPass = function () {
    const p = this.replay.passes[this.replay.i];
    this.t = p.from;
    this.cam = null; // カットで切り替え
    this.slowEl.textContent = 'REPLAY ' + (this.replay.i + 1) + '/' + this.replay.passes.length + (p.rate < 1 ? ' ×' + p.rate : '');
    this.banner(p.name, 'info', 1.6);
    this.comment('リプレイ：' + p.name, this.replay.i === 0 ? 1 : -1);
  };
  RaceView.prototype.updateReplay = function () {
    const p = this.replay.passes[this.replay.i];
    if (this.t < p.to) return;
    this.replay.i++;
    if (this.replay.i < this.replay.passes.length) this.beginPass();
    else this.endReplay();
  };
  RaceView.prototype.endReplay = function () {
    if (!this.replay) return;
    this.replay = null;
    this.state = 'race';
    this.t = this.lastFinishT() + 1.3;
    this.cam = null;
    this.slowEl.classList.remove('show');
    this.finishedShown = true;
    this.leaderFinished = true;
    if (this.opts.replayOnly && this.opts.replayOnly()) { this.finish(); return; }
    this.showBoard(true);
  };

  // ---------- ゴール写真（ゴール線上の瞬間を撮影し、着差を書き込む） ----------
  RaceView.prototype.capturePhoto = function () {
    const saved = { t: this.t, cam: this.cam, cam2: this.cam2 };
    try {
      const fo = this.sim.finishOrder, ft = this.sim.finishTimes;
      const C = this.course, D = this.D;
      this.t = ft[fo[0]];
      const snap = this.snapshot();
      const top = fo.slice(0, 3).map((n) => snap.find((x) => x.r.num === n));
      const laneC = (top[0].st.lane + top[Math.min(1, top.length - 1)].st.lane) / 2;
      const P = (sd, l, y) => { const q = C.at(sd, l); return [q.x, y, q.z]; };
      let src, gx, marks = [];
      // 縦長画面でも写真は横長（16:9）で撮る
      const cvs = this.canvas, sw = cvs.width, sh = cvs.height;
      this._noResize = true;
      cvs.width = 960; cvs.height = 540;
      if (this.mode === 'gl') {
        // ゴール線の延長上・外ラチ側の高い位置から（ゴール板の柱が写り込まない）
        this.forceCam = { eye: P(D, C.width + 5, 4.2), target: P(D, laneC - 0.5, 1.3), fov: 0.26 };
        this.cam = null;
        this.renderGL(snap, 0, 0);
        const cv = this.canvas, eng = this.eng;
        const gp = eng.project(P(D, laneC, 0.5));
        gx = gp ? (gp[0] * 0.5 + 0.5) * cv.width : cv.width / 2;
        marks = top.map((x) => {
          const m = this.models[x.r.num];
          const q = m && eng.project(m.labelPos());
          return q ? { x: (q[0] * 0.5 + 0.5) * cv.width, y: (1 - (q[1] * 0.5 + 0.5)) * cv.height, r: x.r } : null;
        });
        src = cv;
      } else {
        this.cam2 = D;
        this.render2D(snap, 0, 0);
        src = this.canvas;
        gx = this._sx ? this._sx(D, laneC) : src.width / 2;
      }
      const out = document.createElement('canvas');
      out.width = 720; out.height = Math.round(720 * src.height / src.width);
      const k = out.width / src.width;
      const g = out.getContext('2d');
      g.drawImage(src, 0, 0, out.width, out.height);
      g.fillStyle = 'rgba(30,24,10,0.12)'; g.fillRect(0, 0, out.width, out.height);
      g.strokeStyle = '#ff3b3b'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(gx * k, 0); g.lineTo(gx * k, out.height); g.stroke();
      marks.forEach((m, i) => {
        if (!m) return;
        const txt = (i + 1) + '着 ' + m.r.num + '番' + (i ? ' ' + U.marginText(ft[fo[i]] - ft[fo[i - 1]]) : '');
        g.font = 'bold 22px sans-serif';
        const w = g.measureText(txt).width + 20;
        // 画面上部に重ならないよう段違いに並べ、馬へ引き出し線を引く
        const bx = U.clamp(m.x * k, w / 2 + 4, out.width - w / 2 - 4), by = 10 + i * 34;
        g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(bx, by + 30); g.lineTo(m.x * k, Math.max(by + 30, m.y * k)); g.stroke();
        g.fillStyle = 'rgba(8,16,30,0.88)'; g.fillRect(bx - w / 2, by, w, 30);
        g.fillStyle = m.r.wk.color; g.fillRect(bx - w / 2, by, 7, 30);
        g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(txt, bx + 3, by + 16);
      });
      g.fillStyle = 'rgba(8,16,30,0.8)'; g.fillRect(0, out.height - 28, out.width, 28);
      g.fillStyle = '#ffd36a'; g.font = 'bold 14px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
      g.fillText('PHOTO FINISH  ' + this.venue.short + ' ' + this.race.no + 'R  1着 ' + U.fmtTime(ft[fo[0]]), 10, out.height - 14);
      const url = out.toDataURL('image/jpeg', 0.86);
      cvs.width = sw; cvs.height = sh;
      return url;
    } catch (e) {
      console.warn('ゴール写真の作成に失敗', e);
      return null;
    } finally {
      this._noResize = false;
      this.forceCam = null;
      this.t = saved.t; this.cam = saved.cam; this.cam2 = saved.cam2;
    }
  };

  RaceView.prototype.updateRaceLogic = function (snap, dtReal) {
    if (this.state !== 'race') return;
    const D = this.D;
    const lead = snap[0];
    // ---- ゴール前スロー演出 ----
    // 先頭が残り SLOW_START m に来たら開始し、上位3頭がゴールして少し経ったら終了する。
    // 再生速度を変えるだけなので、着順・払戻には影響しない。
    const runningLead = snap.find((x) => !x.fin);
    const fo = this.sim.finishOrder;
    const third = this.sim.finishTimes[fo[Math.min(2, fo.length - 1)]];
    const slowEnd = Math.min(third + 0.5, this.sim.finishTimes[fo[0]] + 2.6);
    const want = !!this.settings.slowmo && !this._skipped && !this.paused &&
      (D - snap[0].st.s) < SLOW_START && this.t < slowEnd;
    if (want && !this.slowActive) {
      this.slowActive = true;
      if (this.photoGap < 0.12 && !this._closeShown) { this._closeShown = true; this.banner('大接戦！', 'hot', 2.2); }
    }
    if (!want && this.slowActive && this.t >= slowEnd) { this.slowActive = false; this.slowDone = true; }
    // 開始は素早く、終了はなめらかに
    this.slowW = U.clamp(this.slowW + (this.slowActive ? dtReal * 5 : -dtReal * 1.6), 0, 1);
    this.slowEl.classList.toggle('show', this.slowW > 0.3);
    this.slowEl.textContent = 'SLOW ×' + this.slowRate.toFixed(2).replace(/0$/, '');
    // 1着ゴール
    if (!this.leaderFinished && lead.fin) {
      this.leaderFinished = true;
      this.banner('ゴール！', 'goal', 2.0);
      RRG.audio.goal();
      const sec = snap[1];
      // 勝ち方（逃げ切り・差し切り・追い込み）で実況を変える
      const at = this.talk && this.talk.order400 ? this.talk.order400.indexOf(lead.r.num) : -1;
      const how = at === 0 ? (lead.r.h.style === '逃げ' ? '逃げ切った！' : '押し切った！') : at >= 5 ? (lead.r.h.style === '追込' ? '大外一気、追い込んだ！' : '鮮やかに差し切った！') : '抜け出した！';
      const close = this.photoGap < 0.08;
      this.comment(this.call(lead.r) + '、' + how + ' ゴールイン！' + (close ? ' 2着とは大接戦、写真判定です！' : sec ? '　2着は' + this.call(sec.r) : ''), 2);
    }
    // 全馬ゴール → 着順掲示
    if (!this.finishedShown && this.t > this.lastFinishT() + 1.2) {
      this.finishedShown = true;
      this.showBoard();
    }
    // 実況
    if (!this.leaderFinished && runningLead) {
      const T = this.talk || (this.talk = {});
      const sec = this.course.sectionName(runningLead.st.s);
      const rem = D - runningLead.st.s;
      const run = snap.filter((x) => !x.fin);
      this.commentT -= dtReal;
      const once = (key, f) => { if (!T[key]) { T[key] = true; f(); this.commentT = 4; return true; } return false; };
      if (rem < 400 && !T.order400) T.order400 = run.map((x) => x.r.num);
      if (this.t > 2.6 && !T.slowStart) {
        T.slowStart = true;
        // 出遅れた馬（先頭集団より大きく遅れている）
        const lastX = run[run.length - 1], avg = run.reduce((a, x) => a + x.st.s, 0) / run.length;
        if (lastX && avg - lastX.st.s > 5) { this.comment(this.call(lastX.r) + 'は出遅れました！', 1); this.commentT = 3; }
      } else if (this.t > 7 && once('lead', () => this.comment('先手を取ったのは' + this.call(runningLead.r) + '。' + (run[1] ? '2番手に' + this.call(run[1].r) + '。' : ''), 1))) {
        // 序盤の隊列
      } else if (rem < 210 && once('r200', () => {
        const a2 = run[0], b2 = run[1];
        const gap = b2 ? (a2.st.s - b2.st.s) / 2.4 : 9;
        this.comment('残り200！ ' + (gap < 1 ? this.call(a2.r) + 'か、' + this.call(b2.r) + 'か！' : this.call(a2.r) + 'が抜け出した！ リードは' + Math.max(1, Math.round(gap)) + '馬身！'), 2);
      })) {
        // 残り200m
      } else if (this.lastLeader != null && this.lastLeader !== runningLead.r.num && this.t > 3) {
        if (rem < 450) this.comment(this.call(runningLead.r) + '、先頭に立った！', rem < 250 ? 2 : 1);
        else this.comment('先頭が替わって ' + this.call(runningLead.r), 0);
        this.commentT = 4;
      } else if (sec !== this.lastSection && this.t > 4) {
        const second = run[1];
        if (sec === '最後の直線') {
          // 最も勢いのある馬（先頭以外の上位6頭で最速）
          const ch = run.slice(1, 7).sort((a, b) => b.st.v - a.st.v)[0];
          this.comment('最後の直線に向いた！ 先頭は' + this.call(runningLead.r) + (ch ? '、' + (ch.st.lane > runningLead.st.lane + 2 ? '外から' : '内から') + this.call(ch.r) + 'が伸びてくる！' : '！'), 2);
          RRG.audio.setCrowd(0.85); this.banner('最後の直線！', 'hot', 1.8);
        } else if (sec === '向こう正面') {
          const spread = (runningLead.st.s - run[run.length - 1].st.s) / 2.4;
          this.comment('向こう正面、先頭は' + this.call(runningLead.r) + '。最後方まではおよそ' + Math.max(1, Math.round(spread)) + '馬身の隊列です', 1);
        } else if (sec === '4コーナー') {
          this.comment('4コーナーを回って勝負どころ！ 先頭は' + this.call(runningLead.r) + (second ? '、' + this.call(second.r) + 'が並びかける！' : ''), 1);
        } else {
          this.comment(sec + '、先頭は' + this.call(runningLead.r) +
            (second ? '。' + ((runningLead.st.s - second.st.s) / 2.4 < 1 ? '並んで' : '続いて') + this.call(second.r) : ''), 1);
        }
        this.commentT = 4;
      } else if (this.commentT < 0 && rem < 600 && rem > 220) {
        const mine = snap.filter((x) => this.myNums.has(x.r.num));
        if (mine.length) {
          const m = mine[0];
          const pos = snap.indexOf(m) + 1;
          this.comment('応援の ' + this.call(m.r) + ' は現在' + pos + '番手！', 0);
        }
        this.commentT = 5;
      }
      this.lastSection = sec;
      this.lastLeader = runningLead.r.num;
      // 歓声（終盤ほど大きく）
      const prog = runningLead.st.s / D;
      RRG.audio.setCrowd(this.paused ? 0.15 : 0.3 + Math.max(0, prog - 0.6) * 1.6);
    } else if (this.leaderFinished) {
      RRG.audio.setCrowd(this.t - this.lastFinishT() > 2 ? 0.35 : 1);
    }
    // 蹄音
    const sp = runningLead ? runningLead.st.v : 4;
    const near = this.camDistToPack != null ? U.clamp(1.4 - this.camDistToPack / 90, 0.15, 1) : 0.6;
    const level = this.paused ? 0 : U.clamp(sp / 17, 0, 1) * near * (this.finishedShown ? 0.2 : 1);
    RRG.audio.setHooves(level, (sp / (2.3 + 0.28 * sp)) * 4 * Math.min(3, this.runners.length / 3) * Math.min(2, this.speed));
  };

  RaceView.prototype.showBoard = function (again) {
    const order = this.sim.finishOrder;
    const t1 = this.sim.finishTimes[order[0]], t2 = this.sim.finishTimes[order[1]];
    const photo = (t2 - t1) < 0.08;
    if (!this.photoUrl) this.photoUrl = this.capturePhoto();
    const render = () => {
      let h = '<div class="rv-board-title">着順' + (photo ? '確定' : '') + '</div>';
      if (photo && this.photoUrl) h += '<img class="rv-photo-img" alt="ゴール写真" src="' + this.photoUrl + '">';
      h += '<table>';
      order.slice(0, 5).forEach((num, i) => {
        const r = this.byNum[num];
        const margin = i === 0 ? U.fmtTime(r.finishT) : U.marginText(r.finishT - this.sim.finishTimes[order[i - 1]]);
        h += '<tr class="' + (this.myNums.has(num) ? 'mine' : '') + '"><td class="pos">' + (i + 1) + '</td><td><span class="num-chip" style="background:' + r.wk.color + ';color:' + r.wk.text + '">' + num +
          '</span></td><td class="nm">' + U.escapeHtml(r.name) + '</td><td class="mg">' + margin + '</td></tr>';
      });
      h += '</table><div class="rv-board-btns"><button class="btn rv-replay-btn">🔁 リプレイ</button><button class="btn btn-gold rv-result-btn">結果・払戻を見る</button></div>';
      this.boardEl.innerHTML = h;
      this.boardEl.className = 'rv-board show';
      this.boardEl.querySelector('.rv-result-btn').addEventListener('click', () => this.finish());
      this.boardEl.querySelector('.rv-replay-btn').addEventListener('click', () => this.startReplay());
      if (!again) this.banner('確定', 'goal', 1.6);
    };
    if (photo && !again) {
      this.boardEl.innerHTML = '<div class="rv-board-title">写真判定中…</div><div class="rv-photo">📷 1着・2着の着差を判定しています</div>';
      this.boardEl.className = 'rv-board show';
      this.banner('写真判定', 'info', 2.2);
      setTimeout(render, this.speed > 1 ? 900 : 2200);
    } else render();
  };

  RaceView.prototype.finish = function () {
    if (this.done) return;
    this.done = true;
    this.stop();
    if (this.opts.onFinish) this.opts.onFinish();
  };

  // ---------- カメラ ----------
  RaceView.prototype.cameraFor = function (snap, aspect) {
    const C = this.course, D = this.D, W = C.width;
    let mode = CAMS[this.camIdx].id;
    const run = snap.filter((x) => !x.fin);
    const leadS = snap[0].st.s;
    // 注目点: 先頭集団（先頭から30m以内）の重心
    let focusS = leadS, n = 0, sum = 0;
    snap.forEach((x) => { if (leadS - x.st.s < 30) { sum += x.st.s; n++; } });
    if (n) focusS = U.lerp(sum / n, leadS, 0.45);
    let eye, target, fov = 0.6;
    const P = (s, lane, y) => { const p = C.at(s, lane); return [p.x, y, p.z]; };
    const portrait = aspect < 1;

    if (this.state === 'intro') {
      // ゲート周りをゆっくり回る
      const k = this.introT / this.introDur;
      const g = C.at(-1.5, W / 2);
      const ang = 0.95 - k * 1.25; // 内馬場側から回り込む（スタンドと重ならない）
      const tg = C.at(0, W / 2);
      const yaw0 = Math.atan2(tg.tx, tg.tz);
      const dist = portrait ? 30 : 22;
      eye = [g.x + Math.sin(yaw0 + ang) * dist, 5 + k * 3, g.z + Math.cos(yaw0 + ang) * dist];
      target = [g.x, 1.2, g.z];
      return { eye, target, fov: portrait ? 0.95 : 0.7, snap: k < 0.02 };
    }
    if (this.replay) mode = this.replay.passes[this.replay.i].cam;
    // スロー中のカメラ（設定: 自動切替 / 真横 / 真上 / 切替なし）
    const slowCam = this.settings.slowCam || 'auto';
    if (this.slowActive && slowCam !== 'none' && mode !== 'goalside' && mode !== 'goaltop') {
      if (slowCam === 'side') mode = 'goalside';
      else if (slowCam === 'top') mode = 'goaltop';
      else {
        // 自動: 接近中は真上から位置関係を見せ、ゴール直前で真横のゴール板カメラに切り替える
        const rem = D - leadS;
        mode = (this.leaderFinished || rem < 9) ? 'goalside' : 'goaltop';
      }
    } else if (mode === 'auto') {
      if (this.t < 3.2) mode = 'gatefront';
      else if (this.finishedShown) mode = 'finishpan';
      else if (this.leaderFinished) mode = 'finishline';
      else if (D - leadS < 330) mode = 'stretch';
      else mode = 'broadcast';
    }
    const fav = snap.find((x) => x.r.num === this.favNum) || snap[0];
    switch (mode) {
      case 'gatefront': {
        eye = P(26, W * 0.5, 4.5);
        target = P(0, W * 0.4, 1.3);
        fov = portrait ? 1.0 : 0.75;
        break;
      }
      case 'broadcast': {
        // 中継カメラ: 内馬場側の高所から先頭集団を斜めに見下ろす（背景にスタンド・外の景色）
        const off = portrait ? 66 : 50;
        eye = P(focusS - 6, -off, portrait ? 30 : 22);
        target = P(focusS + 2, W * 0.45, 1.0);
        fov = portrait ? 0.7 : 0.46;
        break;
      }
      case 'stretch': {
        // 最後の直線: 内ラチ側の低い位置から、スタンドを背に迫ってくる馬群を捉える
        const off = portrait ? 34 : 24;
        eye = P(focusS + 22, -off, portrait ? 12 : 8);
        target = P(focusS + 1, W * 0.45, 1.3);
        fov = portrait ? 0.82 : 0.55;
        break;
      }
      case 'finishline': {
        eye = P(D + 3, -(portrait ? 30 : 20), portrait ? 9 : 6);
        target = P(D - 5, W * 0.45, 1.3);
        fov = portrait ? 0.9 : 0.62;
        break;
      }
      case 'finishpan': {
        const k = Math.min(1, (this.t - this.lastFinishT()) / 6);
        const w = snap[0];
        const s0 = w.st.s;
        eye = P(s0 + 9 - k * 3, w.st.lane - 9 - k * 6, 3.5 + k * 3);
        target = P(s0 - 2, w.st.lane, 1.5);
        fov = portrait ? 0.9 : 0.6;
        break;
      }
      case 'goalside': {
        // ゴール線の延長上（内馬場側・ゴール板の後ろ）から真横に、スタンドを背景に捉える
        const back = portrait ? 11 : 16;
        eye = P(D, -back, portrait ? 2.0 : 2.2);
        target = P(D, W * 0.4, 1.3);
        fov = portrait ? 1.0 : 0.62;
        return { eye, target, fov, mode, cut: true };
      }
      case 'goaltop': {
        // ゴール線の真上から真下を見る。先頭集団に合わせて追い、ゴール線を画面に入れる
        let ln = 0, cnt = 0;
        snap.forEach((x) => { if (leadS - x.st.s < 12) { ln += x.st.lane; cnt++; } });
        const laneC = U.clamp(cnt ? ln / cnt : W / 2, portrait ? 1.6 : 2.6, W - 3);
        const cs = U.clamp(leadS - (portrait ? 2 : 5), D - 24, D - (portrait ? 2 : 6));
        const c = C.at(cs, laneC);
        const h = portrait ? 24 : 21;
        eye = [c.x, h, c.z];
        target = [c.x, 0, c.z];
        // 横長画面では進行方向が左→右、縦長画面では下→上になるよう画面の上方向を決める
        const up = portrait ? [c.tx, 0, c.tz] : [-c.nx, 0, -c.nz];
        fov = portrait ? 0.85 : 0.8;
        return { eye, target, fov, mode, up, cut: true };
      }
      case 'chase': {
        const ref = run.length ? run[0].st.s : leadS;
        const fs = U.lerp(focusS, ref, 0.3);
        eye = P(fs - (portrait ? 34 : 26), W * 0.55 + 4, portrait ? 15 : 11);
        target = P(fs + 10, W * 0.3, 1.0);
        fov = portrait ? 0.95 : 0.7;
        break;
      }
      case 'myhorse': {
        const s = fav.st.s;
        eye = P(s - (portrait ? 13 : 10), fav.st.lane + 3.2, portrait ? 6.5 : 4.8);
        target = P(s + 6, fav.st.lane, 1.3);
        fov = portrait ? 1.0 : 0.75;
        break;
      }
      case 'overview': default: {
        const ext = C.Ls / 2 + C.R + W;
        // 向こう正面側の上空からスタンド方向を見下ろす
        const h = portrait ? ext * 2.3 : ext * 0.95;
        eye = [0, h, -(C.R + W + (portrait ? ext * 0.6 : ext * 0.85))];
        target = [0, 0, C.R * 0.08];
        fov = 0.75;
        break;
      }
    }
    // ドラッグによる視点回転（注目点まわり）
    if (this.dragYaw && mode !== 'overview') {
      const dx = eye[0] - target[0], dz = eye[2] - target[2];
      const c = Math.cos(this.dragYaw), s = Math.sin(this.dragYaw);
      eye = [target[0] + dx * c - dz * s, eye[1], target[2] + dx * s + dz * c];
    }
    return { eye, target, fov, mode };
  };

  RaceView.prototype.renderGL = function (snap, dtGame, dtReal) {
    const eng = this.eng;
    if (!this._noResize) eng.resize(this.pixelRatio());
    const aspect = this.canvas.width / this.canvas.height;
    const C = this.course;
    // カメラ（先に決めて、画面外の馬の計算を省く）
    const cam = this.forceCam || this.cameraFor(snap, aspect);
    // ゴール真横・真上へはカットで切り替え、その間は固定（中継のスイッチング風）
    const cut = cam.mode !== this.lastCamMode && (cam.cut || (this.lastCamMode === 'goalside' || this.lastCamMode === 'goaltop'));
    this.lastCamMode = cam.mode;
    let k = this.cam == null || cam.snap || cut ? 1 : 1 - Math.exp(-dtReal * (cam.mode === 'gatefront' ? 6 : 2.6));
    if (cam.cut && cam.mode === 'goaltop') k = 1 - Math.exp(-dtReal * 10); // 真上は先頭をなめらかに追う
    if (cut) k = 1;
    if (!this.cam) this.cam = { eye: cam.eye.slice(), target: cam.target.slice(), fov: cam.fov };
    this.cam.up = cam.up || null;
    for (let i = 0; i < 3; i++) {
      this.cam.eye[i] = U.lerp(this.cam.eye[i], cam.eye[i], k);
      this.cam.target[i] = U.lerp(this.cam.target[i], cam.target[i], Math.min(1, k * 1.6));
    }
    this.cam.fov = U.lerp(this.cam.fov, cam.fov, k);
    const lp = C.at(snap[0].st.s, snap[0].st.lane);
    this.camDistToPack = Math.hypot(this.cam.eye[0] - lp.x, this.cam.eye[1], this.cam.eye[2] - lp.z);
    eng.setCamera(this.cam.eye, this.cam.target, this.cam.fov, 0.5, 4000, this.cam.up);
    const farDist = 75 * (this.cam.fov > 0 ? 0.6 / Math.max(0.3, this.cam.fov) : 1) * (this.settings.quality === 'low' ? 0.6 : 1);
    // 馬の更新
    const opaque = [], transp = [];
    this.visibleNums = {};
    snap.forEach((x) => {
      const m = this.models[x.r.num];
      const sr = x.st.s - NOSE;
      const p = C.at(sr, x.st.lane);
      const pr = eng.project([p.x, 1.2, p.z]);
      if (!pr || Math.abs(pr[0]) > 1.25 || Math.abs(pr[1]) > 1.4) { m.advance(x.st.v, dtGame); return; }
      // 進行方向 = 接線*速度 + 法線*横速度
      const v = Math.max(0.5, x.st.v);
      const hx = p.tx * v + p.nx * x.st.vl * 0.6, hz = p.tz * v + p.nz * x.st.vl * 0.6;
      const yaw = Math.atan2(hx, hz);
      const finishedLong = x.fin && this.t - x.r.finishT > 1;
      m.update({ x: p.x, z: p.z, yaw, v: x.st.v, dt: dtGame, spurt: !finishedLong && x.st.s > this.D * 0.72 && (this.state === 'race' || this.state === 'replay') });
      m.collect(opaque, transp, pr[2] > farDist);
      this.visibleNums[x.r.num] = true;
    });
    eng.begin();
    this.stadium.draw(eng);
    eng.drawNodes(opaque);
    eng.drawNodes(transp);
    // 大型ビジョン更新
    this.screenT -= dtReal;
    if (this.screenT < 0) { this.screenT = 0.6; this.updateScreenTex(false, snap); }
    this.projectLabels(snap);
  };

  RaceView.prototype.updateScreenTex = function (initial, snap) {
    if (!this.stadium) return;
    if (initial || !snap) {
      this.stadium.updateScreen(this.runners.slice(0, 5).map((r) => ({ num: r.num, name: r.name, waku: r.wk.color, wakuText: r.wk.text })), this.venue.short + ' ' + this.race.name);
      return;
    }
    const title = this.finishedShown ? '確定' : this.state === 'race' ? (this.leaderFinished ? 'ゴール' : '残り ' + Math.max(0, Math.round(this.D - snap[0].st.s)) + 'm') : '出走馬';
    this.stadium.updateScreen(snap.map((x) => ({ num: x.r.num, name: x.r.name, waku: x.r.wk.color, wakuText: x.r.wk.text })), title);
  };

  RaceView.prototype.projectLabels = function (snap) {
    const W = this.canvas.clientWidth, H = this.canvas.clientHeight;
    const show = this.showLabels;
    snap.forEach((x) => {
      const l = this.labels[x.r.num];
      if (!show) { l.style.display = 'none'; return; }
      const m = this.models && this.models[x.r.num];
      let p;
      if (m && this.visibleNums && this.visibleNums[x.r.num]) p = this.eng.project(m.labelPos());
      if (!p || p[0] < -1.1 || p[0] > 1.1 || p[1] < -1.1 || p[1] > 1.1) { l.style.display = 'none'; return; }
      l.style.display = '';
      const sx = (p[0] * 0.5 + 0.5) * W, sy = (1 - (p[1] * 0.5 + 0.5)) * H;
      const scale = U.clamp(28 / p[2], 0.55, 1.15);
      l.style.transform = 'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px) translate(-50%,-100%) scale(' + scale.toFixed(2) + ')';
      l.style.zIndex = String(1000 - Math.round(p[2]));
    });
  };

  RaceView.prototype.pixelRatio = function () {
    const dpr = window.devicePixelRatio || 1;
    return this.settings.quality === 'low' ? Math.min(1, dpr) : Math.min(2, dpr);
  };
  RaceView.prototype.resize = function () {
    if (this.mode === '2d') {
      const c = this.canvas, pr = Math.min(2, window.devicePixelRatio || 1);
      c.width = Math.round(c.clientWidth * pr); c.height = Math.round(c.clientHeight * pr);
    }
  };

  // ---------- HUD ----------
  RaceView.prototype.updateHUD = function (snap, dtReal) {
    const D = this.D;
    const run = snap.find((x) => !x.fin);
    const leadS = snap[0].st.s;
    if (this.state === 'intro') {
      this.distEl.textContent = '発走前';
      this.timeEl.textContent = '0:00.0';
    } else {
      const rem = run ? Math.max(0, D - run.st.s) : 0;
      this.distEl.innerHTML = run ? '残り <b>' + Math.ceil(rem) + '</b>m <small>' + this.course.sectionName(run.st.s) + '</small>' : '<b>全馬ゴール</b>';
      const tShow = Math.min(this.t, this.lastFinishT());
      this.timeEl.textContent = U.fmtTime(tShow);
    }
    // 順位表
    const rowH = 26;
    snap.forEach((x, i) => {
      const rr = this.rankRows[x.r.num];
      rr.row.style.transform = 'translateY(' + (i * rowH) + 'px)';
      rr.pos.textContent = i + 1;
      let gap;
      if (x.fin) gap = i === 0 ? U.fmtTime(x.r.finishT) : U.marginText(x.r.finishT - snap[i - 1].r.finishT);
      else if (i === 0 || !run || this.state === 'intro') gap = '';
      else {
        const lengths = (snap[0].fin ? D - x.st.s : leadS - x.st.s) / 2.4;
        gap = (snap[0].fin ? '' : '+') + (lengths < 0.1 ? '0.0' : lengths.toFixed(1)) + '身';
      }
      if (rr.gap.textContent !== gap) rr.gap.textContent = gap;
      rr.row.classList.toggle('fin', x.fin);
    });
    // 進行バー
    const prog = U.clamp(leadS / D, 0, 1);
    this.fillEl.style.width = (prog * 100) + '%';
    snap.forEach((x, i) => {
      const m = this.marks[x.r.num];
      m.style.left = (U.clamp(x.st.s / D, 0, 1) * 100) + '%';
      m.style.zIndex = String(100 - i);
    });
    this.drawMinimap(snap);
  };

  RaceView.prototype.prepareMinimap = function () {
    const C = this.course, c = this.mini;
    const ext = C.Ls / 2 + C.R + C.width;
    const sx = (c.width - 16) / (2 * ext), sz = (c.height - 16) / (2 * (C.R + C.width));
    this.miniScale = Math.min(sx, sz);
    const bg = document.createElement('canvas');
    bg.width = c.width; bg.height = c.height;
    const g = bg.getContext('2d');
    const tr = (x, z) => [c.width / 2 + x * this.miniScale, c.height / 2 + z * this.miniScale];
    g.fillStyle = 'rgba(6,20,14,0.72)';
    g.fillRect(0, 0, c.width, c.height);
    g.lineWidth = Math.max(3, C.width * this.miniScale);
    g.strokeStyle = this.venue.surface === 'ダート' ? '#8a6a46' : '#3f8c3a';
    g.beginPath();
    for (let u = 0; u <= C.lap; u += 5) { const p = C.atU(u, C.width / 2); const q = tr(p.x, p.z); u ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }
    g.closePath(); g.stroke();
    const f1 = C.at(0, -1), f2 = C.at(0, C.width + 1);
    const a = tr(f1.x, f1.z), b = tr(f2.x, f2.z);
    g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    g.fillStyle = '#ffd36a'; g.font = 'bold 10px sans-serif'; g.fillText('GOAL', b[0] - 12, b[1] + 11);
    this.miniBg = bg;
    this.miniTr = tr;
  };
  RaceView.prototype.drawMinimap = function (snap) {
    const c = this.mini, g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(this.miniBg, 0, 0);
    for (let i = snap.length - 1; i >= 0; i--) {
      const x = snap[i];
      const p = this.course.at(x.st.s, x.st.lane);
      const q = this.miniTr(p.x, p.z);
      g.beginPath(); g.arc(q[0], q[1], this.myNums.has(x.r.num) ? 4.5 : 3.5, 0, 7);
      g.fillStyle = x.r.wk.color; g.fill();
      g.lineWidth = 1; g.strokeStyle = this.myNums.has(x.r.num) ? '#ffd36a' : 'rgba(0,0,0,.7)'; g.stroke();
    }
  };

  // ---------- 2D フォールバック描画（横からの中継風・脚の関節アニメーション付き） ----------
  RaceView.prototype.render2D = function (snap, dtGame) {
    const c = this.canvas, g = this.c2d;
    if (!this._noResize && c.width !== Math.round(c.clientWidth * Math.min(2, window.devicePixelRatio || 1))) this.resize();
    const Wc = c.width, Hc = c.height;
    const D = this.D, W = this.course.width;
    const lead = snap[0].st.s;
    const run = snap.filter((x) => !x.fin);
    const focus = this.state === 'intro' ? 0 : (this.leaderFinished ? D : (run.length ? lead - 5 : D));
    this.cam2 = this.cam2 == null ? focus : U.lerp(this.cam2, focus, 0.08);
    // 画面に映す距離（横長なら広く、縦長なら狭く＝馬を大きく）
    const viewM = U.clamp((Wc / Hc) * 24, 18, 46);
    const scale = Wc / viewM;
    const bandH = Math.min(Hc * 0.5, W * scale * 0.42);
    const bandTop = Math.max(Hc * 0.3, (Hc - bandH) * 0.5);
    const horizon = bandTop - Math.min(Hc * 0.12, 60);
    const night = this.venue.time === 'night', dusk = this.venue.time === 'dusk';
    const sky = g.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, night ? '#05081a' : dusk ? '#3a4a80' : '#3c78d8'); sky.addColorStop(1, night ? '#1a2240' : dusk ? '#f2a06a' : '#bcd8f2');
    g.fillStyle = sky; g.fillRect(0, 0, Wc, horizon);
    g.fillStyle = night ? '#1b2a1b' : '#3f7a33'; g.fillRect(0, horizon, Wc, Hc - horizon);
    // 遠景のスタンドと観客（パララックス）
    const par = (this.cam2 * scale * 0.25) % 240;
    for (let x = -par - 240; x < Wc + 240; x += 240) {
      g.fillStyle = night ? '#2a2f3d' : '#6d727c'; g.fillRect(x, horizon - Hc * 0.08, 220, Hc * 0.08);
      g.fillStyle = night ? '#ffe9a0' : '#c9ced6'; g.fillRect(x, horizon - Hc * 0.1, 220, Hc * 0.02);
      for (let k = 0; k < 30; k++) { g.fillStyle = ['#e9e4dc', '#c8312f', '#2f5fa8', '#e2c044', '#3a8f5c'][k % 5]; g.fillRect(x + 6 + k * 7, horizon - Hc * 0.06 + (k % 3) * 5, 4, 4); }
    }
    const laneY = (lane) => bandTop + (lane / W) * bandH;
    const laneS = (lane) => 0.82 + 0.3 * (lane / W);
    g.fillStyle = this.venue.surface === 'ダート' ? '#9a7650' : '#58a446';
    g.fillRect(0, laneY(-1), Wc, laneY(W + 1) - laneY(-1));
    const sx = (s, lane) => Wc * 0.5 + (s - this.cam2) * scale * laneS(lane);
    this._sx = sx;
    // 距離の縞（流れる芝目）
    g.fillStyle = 'rgba(255,255,255,0.06)';
    for (let s0 = Math.floor((this.cam2 - viewM) / 10) * 10; s0 < this.cam2 + viewM; s0 += 20) {
      g.beginPath(); g.moveTo(sx(s0, -1), laneY(-1)); g.lineTo(sx(s0 + 10, -1), laneY(-1)); g.lineTo(sx(s0 + 10, W + 1), laneY(W + 1)); g.lineTo(sx(s0, W + 1), laneY(W + 1)); g.fill();
    }
    // ラチ
    [[-0.6, 1], [W + 0.6, 1.2]].forEach(([lane, hgt]) => {
      const y = laneY(lane), sc = laneS(lane), ph = hgt * scale * sc * 0.8;
      g.fillStyle = '#fff'; g.fillRect(0, y - ph, Wc, Math.max(2, scale * 0.12));
      for (let s0 = Math.floor((this.cam2 - viewM) / 3) * 3; s0 < this.cam2 + viewM; s0 += 3) g.fillRect(sx(s0, lane), y - ph, Math.max(1.5, scale * 0.08), ph);
    });
    // ゴール線
    for (const gs of [0, D]) {
      g.strokeStyle = '#fff'; g.lineWidth = Math.max(2, scale * 0.25);
      g.beginPath(); g.moveTo(sx(gs, -1), laneY(-1)); g.lineTo(sx(gs, W + 1), laneY(W + 1)); g.stroke();
    }
    // 馬（奥の進路から順に描く）
    const order = snap.slice().sort((a, b) => a.st.lane - b.st.lane);
    order.forEach((x) => {
      const m = this.horse2d || (this.horse2d = {});
      const st = m[x.r.num] || (m[x.r.num] = { phase: Math.random() });
      const v = x.st.v;
      st.phase = (st.phase + v / (2.3 + 0.28 * v) * dtGame) % 1;
      const px = sx(x.st.s - NOSE, x.st.lane);
      if (px < -scale * 4 || px > Wc + scale * 4) return;
      drawHorse2D(g, px, laneY(x.st.lane), laneS(x.st.lane) * scale, st.phase, U.clamp(v / 7, 0, 1), x.r, this.myNums.has(x.r.num));
    });
  };

  function drawHorse2D(g, x, y, sc, ph, amp, r, mine) {
    const coat = D.COATS[r.h.coat] || D.COATS['鹿毛'];
    const TAU = Math.PI * 2;
    const bob = 0.07 * amp * Math.cos(TAU * (ph - 0.62));
    g.save();
    g.translate(x, y);
    g.scale(sc, sc);
    // 影
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 0, 1.4, 0.18, 0, 0, 7); g.fill();
    const by = -1.22 - bob;
    const leg = (hx, hy, fore, p, color) => {
      const duty = 0.38; let a1, a2;
      if (p < duty) { const k = p / duty; a1 = U.lerp(fore ? -0.6 : -0.42, 0.5, k); a2 = fore ? 0 : -0.5; }
      else { const k = (p - duty) / (1 - duty); a1 = 0.5 - (fore ? 1.2 : 0.95) * U.smooth(k); a2 = fore ? 1.75 * Math.sin(Math.PI * Math.min(1, k * 1.2)) : -0.5 - Math.sin(Math.PI * k); }
      a1 *= amp; a2 *= amp;
      if (!fore) a1 += 0.42;
      const l1 = fore ? 0.45 : 0.52, l2 = fore ? 0.55 : 0.58;
      // 画面右が前進方向: 角度+ = 後ろ(左)へ
      const kx = hx - Math.sin(a1) * l1, ky = hy + Math.cos(a1) * l1;
      const fx = kx - Math.sin(a1 + a2) * l2, fy = ky + Math.cos(a1 + a2) * l2;
      g.strokeStyle = color; g.lineCap = 'round';
      g.lineWidth = 0.14; g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky); g.stroke();
      g.lineWidth = 0.08; g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
      g.fillStyle = '#222'; g.fillRect(fx - 0.06, fy - 0.03, 0.14, 0.08);
    };
    const darker = coat.leg;
    leg(0.5, by + 0.2, true, (ph + 0.4) % 1, darker);
    leg(-0.55, by + 0.15, false, ph % 1, darker);
    // 胴
    g.fillStyle = coat.body;
    g.beginPath(); g.ellipse(0, by, 0.95, 0.38, 0, 0, 7); g.fill();
    // 首と頭
    const nk = 0.12 * amp * Math.sin(TAU * (ph - 0.15));
    g.save(); g.translate(0.75, by - 0.15); g.rotate(-0.75 + nk);
    g.fillRect(0, -0.14, 0.9, 0.28);
    g.translate(0.88, 0); g.rotate(1.0);
    g.beginPath(); g.ellipse(0.25, 0, 0.32, 0.12, 0, 0, 7); g.fill();
    g.restore();
    // 尻尾
    g.strokeStyle = coat.mane; g.lineWidth = 0.1;
    g.beginPath(); g.moveTo(-0.92, by - 0.1); g.quadraticCurveTo(-1.4, by - 0.05 + 0.1 * Math.sin(TAU * ph), -1.6, by + 0.4 - amp * 0.3); g.stroke();
    leg(0.62, by + 0.2, true, (ph + 0.5) % 1, coat.leg);
    leg(-0.45, by + 0.15, false, (ph + 0.11) % 1, coat.leg);
    // ゼッケン
    g.fillStyle = '#f4f4f0'; g.fillRect(-0.3, by - 0.15, 0.5, 0.36);
    g.fillStyle = '#111'; g.font = 'bold 0.3px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(r.num), -0.05, by + 0.03);
    // 騎手
    g.fillStyle = r.h.silk.body; g.beginPath(); g.ellipse(0.15, by - 0.62 + bob * 0.6, 0.32, 0.15, -0.2, 0, 7); g.fill();
    g.fillStyle = r.h.silk.accent; g.fillRect(0.0, by - 0.66 + bob * 0.6, 0.3, 0.06);
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-0.05, by - 0.55); g.lineTo(0.25, by - 0.3); g.lineTo(0.05, by - 0.2); g.lineWidth = 0.09; g.strokeStyle = '#fff'; g.stroke();
    g.fillStyle = r.wk.color; g.beginPath(); g.arc(0.5, by - 0.78 + bob * 0.6, 0.13, 0, 7); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 0.02; g.stroke();
    if (mine) { g.fillStyle = '#ffd36a'; g.font = 'bold 0.45px sans-serif'; g.fillText('★', 0.5, by - 1.15); }
    g.restore();
  }

  RRG.RaceView = RaceView;
  RRG.RaceView.CAMS = CAMS;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/paddock.js */
/* paddock.js — パドック（下見所）の3D表示
 * 出走馬が楕円の周回コースを常歩（なみあし）で歩く。気配の悪い馬は首を上げ下げしてイレ込む。
 * 馬をタップ（一覧から選択）するとカメラがその馬を追う。
 */
(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};
  const GL = RRG.gl, M4 = GL.M4, U = RRG.util, D = RRG.data;

  const RX = 15, RZ = 8;           // 周回路の半径
  function ringPos(u) {            // u: 0..1 周回位置
    const a = u * Math.PI * 2;
    const x = Math.cos(a) * RX, z = Math.sin(a) * RZ;
    const tx = -Math.sin(a) * RX, tz = Math.cos(a) * RZ;
    const l = Math.hypot(tx, tz);
    return { x, z, tx: tx / l, tz: tz / l };
  }
  // 楕円の周長
  const PERIM = Math.PI * (3 * (RX + RZ) - Math.sqrt((3 * RX + RZ) * (RX + 3 * RZ)));

  function Paddock(canvas, labelsEl) {
    this.canvas = canvas;
    this.labelsEl = labelsEl;
    this.eng = new GL.Engine(canvas, { antialias: true });
    const eng = this.eng;
    Object.assign(eng.env, RRG.Stadium.ENV.day, { fogNear: 120, fogFar: 600 });
    const b = new GL.Builder();
    const I = () => M4.create();
    const trs = (x, y, z, ry, sx, sy, sz) => M4.trs(M4.create(), x, y, z, 0, ry || 0, 0, sx, sy, sz);
    const box = GL.box(1, 1, 1);
    // 地面（芝）・中央の植え込み
    b.add(GL.plane(400, 400), I(), '#3f7a33');
    b.add(GL.sphere(20, 6), trs(0, 0, 0, 0, RX - 4, 0.6, RZ - 3.5), '#2f6a2c');
    // 周回路（土）
    const ring = new GL.Geo();
    const n = 96;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      [[RX - 1.6, RZ - 1.6], [RX + 1.6, RZ + 1.6]].forEach(([rx, rz]) => {
        ring.p.push(Math.cos(a) * rx, 0.02, Math.sin(a) * rz); ring.n.push(0, 1, 0); ring.uv.push(0, 0); ring.c.push(0.62, 0.5, 0.36, 1);
      });
      if (i < n) { const k = i * 2; ring.i.push(k, k + 3, k + 1, k, k + 2, k + 3); }
    }
    b.add(ring, I());
    // 柵（内外）
    [[RX - 2.2, RZ - 2.2], [RX + 2.4, RZ + 2.4]].forEach(([rx, rz]) => {
      let prev = null;
      for (let i = 0; i <= 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        const p = [Math.cos(a) * rx, Math.sin(a) * rz];
        b.add(box, trs(p[0], 0.5, p[1], 0, 0.1, 1, 0.1), '#f4f4f0');
        if (prev) {
          const len = Math.hypot(p[0] - prev[0], p[1] - prev[1]);
          b.add(box, trs((p[0] + prev[0]) / 2, 0.95, (p[1] + prev[1]) / 2, Math.atan2(p[0] - prev[0], p[1] - prev[1]), 0.08, 0.08, len), '#f4f4f0');
        }
        prev = p;
      }
    });
    // 観覧スペースの人々と建物
    const rng = U.RNG(5);
    const cols = ['#e9e4dc', '#c8312f', '#2f5fa8', '#e2c044', '#3a8f5c', '#262626', '#d77a2f', '#76a8d8'];
    for (let i = 0; i < 160; i++) {
      const a = rng() * Math.PI * 2, r = 1 + 0.12 + rng() * 0.25;
      const x = Math.cos(a) * (RX + 4) * r, z = Math.sin(a) * (RZ + 4) * r;
      if (z < -RZ - 3) continue;
      const h = 1.5 + rng() * 0.3;
      b.add(GL.cylinder(0.22, 0.25, h * 0.85, 6), trs(x, h * 0.85, z, 0, 1, 1, 1), cols[i % cols.length]);
      b.add(GL.sphere(6, 4), trs(x, h * 0.95, z, 0, 0.16, 0.18, 0.16), '#d9a982');
    }
    // 観覧スタンド（段差＋屋根）
    for (let i = 0; i < 5; i++) b.add(box, trs(0, 0.5 + i * 0.7, -(RZ + 9 + i * 1.6), 0, 40, 1 + i * 1.4, 1.6), i % 2 ? '#7d838d' : '#6d727c');
    b.add(box, trs(0, 7.5, -(RZ + 13), 0, 44, 0.5, 9), '#e9ecef');
    [-20, -10, 0, 10, 20].forEach((x) => b.add(GL.cylinder(0.25, 0.25, 7.5, 6), trs(x, 7.5, -(RZ + 9.5), 0, 1, 1, 1), '#dfe3e8'));
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * Math.PI * 2;
      const x = Math.cos(a) * (RX + 22), z = Math.sin(a) * (RZ + 20);
      if (z < -RZ - 8) continue;
      b.add(GL.cylinder(0.25, 0.35, 4, 6), trs(x, 4, z, 0, 1, 1, 1), '#5a3f2a');
      b.add(GL.sphere(8, 6), trs(x, 6, z, 0, 2.6, 2.4, 2.6), ['#2d5a27', '#3a6b2c', '#456f2f'][i % 3]);
    }
    this.meshes = eng.meshes(b);
    this.mat = { color: [1, 1, 1, 1], spec: 0.05 };
    this.models = [];
    this.focus = null;
    this.t = 0;
    this.running = false;
  }

  Paddock.prototype.setRace = function (race) {
    const game = RRG.game;
    this.race = race;
    this.labelsEl.innerHTML = '';
    this.models = race.runners.map((r, i) => {
      const h = game.horse(r.horseId);
      const w = D.WAKU[r.waku];
      const m = new RRG.HorseModel(this.eng, { num: r.num, name: h.name, coat: h.coat, silk: h.silk, wakuColor: w.color, blaze: (h.id % 3) === 0, noJockey: true });
      const lab = document.createElement('div');
      lab.className = 'rv-label';
      lab.innerHTML = '<span style="background:' + w.color + ';color:' + w.text + '">' + r.num + '</span>';
      this.labelsEl.appendChild(lab);
      // 馬番順に等間隔で並んで周回（気配の悪い馬は歩様が乱れる）
      return { m, r, lab, u: 1 - i / race.runners.length, toss: r.cond <= -1 ? (r.cond <= -2 ? 1 : 0.55) : 0 };
    });
  };

  Paddock.prototype.start = function () {
    if (this.running) return;
    this.running = true;
    let last = performance.now();
    const loop = (ts) => {
      if (!this.running) return;
      if (!document.body.contains(this.canvas)) { this.running = false; return; }
      const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
      try { this.frame(dt); } catch (e) { console.error(e); this.running = false; return; }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  };
  Paddock.prototype.stop = function () { this.running = false; cancelAnimationFrame(this.raf); };

  Paddock.prototype.frame = function (dt) {
    const eng = this.eng;
    this.t += dt;
    eng.resize(Math.min(2, window.devicePixelRatio || 1));
    const op = [], tr = [];
    const speed = 1.45; // m/s
    this.models.forEach((o) => {
      // イレ込む馬は歩くペースが不規則
      const jitter = o.toss ? 1 + 0.25 * Math.sin(this.t * 2.1 + o.r.num) : 1;
      o.u = (o.u + (speed * jitter * dt) / PERIM) % 1;
      const p = ringPos(o.u);
      o.p = p;
      o.m.update({ x: p.x, z: p.z, yaw: Math.atan2(p.tx, p.tz), v: speed * jitter, dt, walk: true, toss: o.toss });
      o.m.collect(op, tr);
    });
    // カメラ
    let eye, target, fov;
    const f = this.focus != null ? this.models.find((o) => o.r.num === this.focus) : null;
    const aspect = this.canvas.width / this.canvas.height;
    if (f) {
      const p = f.p;
      // 馬の斜め前・外側から
      const ox = p.x * 0.18 + p.tx * 2.5, oz = p.z * 0.18 + p.tz * 2.5;
      const l = Math.hypot(p.x, p.z) || 1;
      eye = [p.x + (p.x / l) * 6.5 + p.tx * 3.5, 2.6, p.z + (p.z / l) * 6.5 + p.tz * 3.5];
      target = [p.x + ox * 0.1, 1.1, p.z + oz * 0.1];
      fov = aspect < 1 ? 0.95 : 0.65;
    } else {
      const a = this.t * 0.08;
      const r = aspect < 1 ? 38 : 30;
      eye = [Math.cos(a) * r, aspect < 1 ? 20 : 13, Math.sin(a) * r + 4];
      target = [0, 0, 0];
      fov = aspect < 1 ? 0.95 : 0.7;
    }
    if (!this.cam) this.cam = { eye: eye.slice(), target: target.slice(), fov };
    const k = 1 - Math.exp(-dt * 3);
    for (let i = 0; i < 3; i++) { this.cam.eye[i] = U.lerp(this.cam.eye[i], eye[i], k); this.cam.target[i] = U.lerp(this.cam.target[i], target[i], k); }
    this.cam.fov = U.lerp(this.cam.fov, fov, k);
    eng.setCamera(this.cam.eye, this.cam.target, this.cam.fov, 0.3, 1500);
    eng.begin();
    this.meshes.forEach((m) => eng.draw(m, M4.create(), this.mat));
    eng.drawNodes(op);
    eng.drawNodes(tr);
    // 馬番ラベル
    const W = this.canvas.clientWidth, H = this.canvas.clientHeight;
    this.models.forEach((o) => {
      const q = eng.project(o.m.labelPos());
      if (!q || Math.abs(q[0]) > 1.1 || Math.abs(q[1]) > 1.1) { o.lab.style.display = 'none'; return; }
      o.lab.style.display = '';
      const sc = U.clamp(30 / q[2], 0.6, 1.3);
      o.lab.style.transform = 'translate(' + ((q[0] * 0.5 + 0.5) * W).toFixed(1) + 'px,' + ((1 - (q[1] * 0.5 + 0.5)) * H).toFixed(1) + 'px) translate(-50%,-100%) scale(' + sc.toFixed(2) + ')';
      o.lab.style.zIndex = String(1000 - Math.round(q[2]));
      o.lab.classList.toggle('mine', this.focus === o.r.num);
    });
  };

  RRG.Paddock = Paddock;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/ui.js */
/* ui.js — 画面（メニュー・競馬場選択・出走表・馬券購入・観戦・結果・戦績・馬名鑑・設定） */
(function (G) {
  'use strict';
  const RRG = G.RRG = G.RRG || {};
  const U = RRG.util, D = RRG.data, B = RRG.betting;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = U.escapeHtml;

  function abilityScore(h) { return h.spd * 0.34 + h.kick * 0.2 + h.sta * 0.2 + h.acc * 0.14 + h.cor * 0.12; }
  function abilityRank(h) {
    const s = abilityScore(h);
    return s >= 85 ? 'S' : s >= 80 ? 'A' : s >= 75 ? 'B' : s >= 70 ? 'C' : 'D';
  }
  function chip(num, waku) {
    const w = D.WAKU[waku];
    return '<span class="num-chip" style="background:' + w.color + ';color:' + w.text + '">' + num + '</span>';
  }
  function silkSwatch(s) {
    let bg = s.body;
    if (s.pattern === 'hoops') bg = 'repeating-linear-gradient(180deg,' + s.body + ' 0 4px,' + s.accent + ' 4px 7px)';
    else if (s.pattern === 'stripes') bg = 'repeating-linear-gradient(90deg,' + s.body + ' 0 4px,' + s.accent + ' 4px 7px)';
    else if (s.pattern === 'sash') bg = 'linear-gradient(135deg,' + s.body + ' 40%,' + s.accent + ' 40% 60%,' + s.body + ' 60%)';
    else if (s.pattern === 'dots') bg = 'radial-gradient(circle,' + s.accent + ' 2px, transparent 2.5px) 0 0/7px 7px,' + s.body;
    else if (s.pattern === 'chevron') bg = 'linear-gradient(160deg,' + s.body + ' 45%,' + s.accent + ' 45% 62%,' + s.body + ' 62%)';
    else bg = 'linear-gradient(180deg,' + s.body + ' 45%,' + s.accent + ' 45% 62%,' + s.body + ' 62%)';
    return '<i class="silk" style="background:' + bg + ';border-left:4px solid ' + s.sleeve + ';border-right:4px solid ' + s.sleeve + '"></i>';
  }
  function statBar(label, v) {
    return '<div class="sbar"><div class="lbl"><span>' + label + '</span><b>' + v + '</b></div><div class="track"><div class="fill" style="width:' + Math.round((v - 40) / 60 * 100) + '%"></div></div></div>';
  }
  function weatherBadge(r) {
    const w = D.WEATHERS.find((x) => x.id === r.weather) || D.WEATHERS[0];
    const gg = D.GOINGS[r.going || 0];
    return '<span class="wx">' + w.icon + ' ' + w.name + '</span><span class="going g' + (r.going || 0) + '" title="' + esc(gg.desc) + '">馬場：' + gg.name + '</span>';
  }
  // 位置取りの推移（通過順位）を折れ線で描く
  function passingChart(r, my) {
    const ps = r.result && r.result.passing;
    if (!ps) return '<p class="muted small">データがありません。</p>';
    const n = r.runners.length, P = ps.orders.length;
    const W = 360, H = 30 + n * 20, x0 = 40, x1 = W - 70;
    const X = (i) => x0 + (x1 - x0) * i / (P - 1), Y = (rk) => 18 + (rk - 1) * 20;
    let svg = '<svg class="pass-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="通過順位の推移">';
    ps.points.forEach((pt, i) => {
      svg += '<line x1="' + X(i) + '" y1="8" x2="' + X(i) + '" y2="' + (H - 14) + '" stroke="rgba(255,255,255,.12)"/>';
      svg += '<text x="' + X(i) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="10" fill="#a9b4c4">' + (i === P - 1 ? 'ゴール' : pt + 'm') + '</text>';
    });
    for (let k = 1; k <= n; k++) svg += '<text x="' + (x0 - 22) + '" y="' + (Y(k) + 4) + '" font-size="10" fill="#6f7f95" text-anchor="end">' + k + '</text>';
    const lines = r.runners.slice().sort((a, b) => (my.has(a.num) ? 1 : 0) - (my.has(b.num) ? 1 : 0));
    lines.forEach((ru) => {
      const w = D.WAKU[ru.waku];
      const pts = ps.orders.map((o, i) => X(i) + ',' + Y(o.indexOf(ru.num) + 1)).join(' ');
      const mine = my.has(ru.num);
      svg += '<polyline points="' + pts + '" fill="none" stroke="' + (w.color === '#f4f4f0' ? '#dfe3e8' : w.color) + '" stroke-width="' + (mine ? 3.2 : 1.6) + '" opacity="' + (mine || !my.size ? 1 : 0.45) + '" stroke-linejoin="round"/>';
      const last = ps.orders[P - 1].indexOf(ru.num) + 1;
      svg += '<g transform="translate(' + (x1 + 6) + ',' + (Y(last) - 8) + ')"><rect width="20" height="16" rx="3" fill="' + w.color + '" stroke="rgba(0,0,0,.4)"/><text x="10" y="12" font-size="11" font-weight="800" text-anchor="middle" fill="' + w.text + '">' + ru.num + '</text></g>';
      svg += '<text x="' + (x1 + 30) + '" y="' + (Y(last) + 4) + '" font-size="10" fill="#cfd8e3">' + ps.orders.map((o) => o.indexOf(ru.num) + 1).slice(0, P - 1).join('-') + '</text>';
    });
    svg += '</svg>';
    return '<div class="scroll-x">' + svg + '</div><p class="small muted">右の数字はコース1/4・1/2・3/4地点の通過順位。太線はあなたが買った馬です。</p>';
  }
  function signed(n) { return (n > 0 ? '+' : n < 0 ? '−' : '±') + U.fmtCoin(Math.abs(n)); }

  const UI = {
    cur: null,
    cardTab: 'card',
    bet: { type: 'tansho', mode: 'normal', sel: [], form: [[], [], []], stake: 100 },
    openDetail: null,
    view: null,
    sim: null,

    init() {
      $('#btn-home').addEventListener('click', () => { RRG.audio.click(); this.goMenu(); });
      RRG.game.onChange(() => this.updateCoins());
      this.updateCoins(true);
      this.sticky = document.createElement('div');
      this.sticky.className = 'sticky-bar';
      document.body.appendChild(this.sticky);
    },

    // ---------- 共通 ----------
    show(id) {
      if (id !== 'card' && this.paddock) this.paddock.stop();
      document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === 'scr-' + id));
      this.cur = id;
      document.body.classList.toggle('racing', id === 'race');
      this.sticky.classList.toggle('show', id === 'card');
      const sc = $('#scr-' + id);
      if (sc) sc.scrollTop = 0;
      if (id === 'menu') setTimeout(() => this.startHero(), 0);
      if (id === 'menu' || id === 'season' || id === 'stats' || id === 'horses' || id === 'settings' || id === 'venue') RRG.audio.bgmStart(); else RRG.audio.bgmStop();
    },
    updateCoins(instant) {
      const el = $('#coin-val');
      const target = RRG.game.save.coins;
      const from = this._coinShown == null ? target : this._coinShown;
      $('#tb-coins').classList.toggle('low', RRG.game.isLow());
      if (instant || from === target) { el.textContent = U.fmtCoin(target); this._coinShown = target; return; }
      const t0 = performance.now(), dur = Math.min(1200, 300 + Math.abs(target - from) / 50);
      cancelAnimationFrame(this._coinRaf);
      $('#tb-coins').classList.add('bump');
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        const v = Math.round(from + (target - from) * U.smooth(k));
        el.textContent = U.fmtCoin(v);
        this._coinShown = v;
        if (k < 1) this._coinRaf = requestAnimationFrame(step);
        else $('#tb-coins').classList.remove('bump');
      };
      this._coinRaf = requestAnimationFrame(step);
    },
    toast(msg, kind, ms) {
      const t = document.createElement('div');
      t.className = 'toast ' + (kind || '');
      t.textContent = msg;
      $('#toast-root').appendChild(t);
      setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, ms || 2400);
    },
    modal(o) {
      const root = $('#modal-root');
      root.innerHTML = '';
      const bd = document.createElement('div');
      bd.className = 'backdrop';
      bd.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + (o.title ? '<h3>' + o.title + '</h3>' : '') + '<div class="mbody">' + (o.body || '') + '</div><div class="mbtns"></div></div>';
      const btns = bd.querySelector('.mbtns');
      (o.buttons || []).forEach((b) => {
        const e = document.createElement('button');
        e.className = 'btn ' + (b.cls || '');
        e.innerHTML = b.label;
        e.addEventListener('click', () => { if (b.keep !== true) this.closeModal(); if (b.onClick) b.onClick(); });
        btns.appendChild(e);
      });
      if (!o.buttons || !o.buttons.length) btns.remove();
      if (o.dismiss !== false) bd.addEventListener('click', (e) => { if (e.target === bd) this.closeModal(); });
      root.appendChild(bd);
      return bd;
    },
    closeModal() { $('#modal-root').innerHTML = ''; },
    confirm(title, body, okLabel, onOk, okCls) {
      this.modal({ title, body, buttons: [{ label: 'キャンセル', cls: 'btn-ghost' }, { label: okLabel || 'OK', cls: okCls || 'btn-gold', onClick: onOk }] });
    },

    // ---------- メニュー ----------
    goMenu() {
      const r = RRG.game.current();
      if (this.cur === 'race' && this.view && !this.view.done) {
        this.confirm('観戦を中断しますか？', 'レース結果は確定済みです。メニューに戻っても、次回起動時に結果と払戻が反映されます。', 'メニューへ', () => {
          this.view.stop(); this.renderMenu(); this.show('menu');
        });
        return;
      }
      if (r && r.settled) RRG.game.finishRace();
      this.renderMenu();
      this.show('menu');
    },
    renderMenu() {
      const g = RRG.game, s = g.save, st = s.stats;
      const r = g.current();
      const bonus = g.bonusState();
      const profit = st.totalPayout - st.totalBet;
      let resume = '';
      if (r && !r.settled) {
        const v = g.venue(r.venueId);
        resume = '<div class="notice gold"><b>進行中のレース</b><span class="grow">' + esc(v.short + ' ' + r.no + 'R ' + r.name) + (r.status === 'open' ? '（発売中・購入' + r.tickets.length + '件）' : '（締切済み・結果未確定）') +
          '</span><button class="btn btn-gold btn-sm" id="mn-resume">' + (r.status === 'open' ? '出走表へ' : '観戦して精算') + '</button></div>';
      }
      $('#scr-menu').innerHTML = '<div class="wrap">' +
        '<div class="hero"><div class="crest">R</div><div class="en">REAL RACING GRAND PRIX</div><h1>リアルレーシング・<b>グランプリ</b></h1>' +
        '<div class="tag">3Dで駆ける競走馬を応援し、予想と馬券で勝負する競馬シミュレーション</div><div class="hero-stage"><canvas id="hero-canvas"></canvas></div>' +
        (g.bestTitle() ? '<div class="title-badge" style="--tc:' + g.bestTitle().color + '">称号：' + esc(g.bestTitle().name) + '</div>' : '') +
        '<div class="coin-hero"><i class="coin-ic"></i><span>' + U.fmtCoin(s.coins) + '</span><small class="muted" style="font-size:14px">コイン</small></div></div>' +
        resume +
        (g.isLow() ? '<div class="notice warn">⚠️ <span class="grow">コイン残高が少なくなっています。' + (bonus.available ? '本日の救済ボーナスを受け取れます。' : '明日になると救済ボーナスを受け取れます。') + '</span></div>' : '') +
        this.missionsHtml() +
        (bonus.available ? '<div class="notice gold">🎁 <span class="grow">' + (bonus.rescue ? '救済ボーナス' : 'デイリーボーナス') + '：<b>' + U.fmtCoin(bonus.amount) + 'コイン</b>（1日1回）</span><button class="btn btn-gold btn-sm" id="mn-bonus">受け取る</button></div>' : '') +

      on('mn-settings', () => { this.renderSettings(); this.show('settings'); });

        RRG.audio.unlock();
        const a = RRG.game.claimMission(b.dataset.claim);

        this.renderMenu();

      on('mn-bonus', () => { const a = RRG.game.claimBonus(); if (a) { RRG.audio.coin(); this.toast('+' + U.fmtCoin(a) + ' コインを受け取りました', 'good'); } this.renderMenu(); });
      on('mn-resume', () => this.resumeRace());

    // メニューの3D馬（走行アニメーションの見本）
    startHero() {
      const cv = $('#hero-canvas');
      if (!cv) return;
      cancelAnimationFrame(this._heroRaf);
      try {
        if (!this.hero || this.hero.canvas !== cv) {
          const eng = new RRG.gl.Engine(cv, { transparent: true });
          Object.assign(eng.env, RRG.Stadium.ENV.day, { fogNear: 500, fogFar: 2000 });
          const pick = D.HORSES[Math.floor(Math.random() * 8)];
          const model = new RRG.HorseModel(eng, { num: 1 + Math.floor(Math.random() * 8), name: pick.name, coat: pick.coat, silk: pick.silk, wakuColor: D.WAKU[1 + Math.floor(Math.random() * 8)].color, blaze: true });
          this.hero = { canvas: cv, eng, model, t: 0 };
        }
      } catch (e) { cv.parentNode.innerHTML = heroHorseSVG(); return; }
      const H = this.hero;
      let last = performance.now();
      const loop = (ts) => {
        if (this.cur !== 'menu' || !document.body.contains(H.canvas)) return;
        const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
        H.t += dt;
        H.eng.resize(Math.min(2, window.devicePixelRatio || 1));
        H.model.update({ x: 0, z: 0, yaw: Math.PI / 2, v: 16.5, dt });
        const sway = Math.sin(H.t * 0.4) * 0.5;
        H.eng.setCamera([Math.sin(sway) * 6.2, 1.6, Math.cos(sway) * 6.2], [0.3, 1.25, 0], 0.5);
        H.eng.begin();
        const op = [], tr = [];
        H.model.collect(op, tr);
        H.eng.drawNodes(op); H.eng.drawNodes(tr);
        this._heroRaf = requestAnimationFrame(loop);
      };
      this._heroRaf = requestAnimationFrame(loop);
    },

          '<rect x="0" y="74" width="300" height="38" fill="#2f6a2c"/>' +
          '<ellipse cx="150" cy="92" rx="140" ry="16" fill="none" stroke="' + ground + '" stroke-width="9"/>' +

            '<div class="meta" style="margin-top:6px;color:#d8dfe8">' + esc(v.desc) + '</div></div>' +
            (lock ? '<div class="lock">🔒 ' + v.unlock + 'レース観戦で開放（現在' + g.save.stats.races + '）</div>' : '') + '</button>';
        }).join('') + '</div></div>';
      document.querySelectorAll('#scr-venue .venue').forEach((b) => b.addEventListener('click', () => {
        RRG.audio.unlock();
        const id = b.dataset.v;
        if (!g.isUnlocked(id)) { RRG.audio.error(); this.toast('この競馬場はまだ開放されていません', 'err'); return; }
        RRG.audio.click();
        this.newRace(id);
      }));
